<p-tabView (onChange)="onTabChange($event)" [activeIndex]="index">
    <p-tabPanel header="Personal Information">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-3">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="pi pi-id-card"></i
                    ></span>
                    <input
                        type="text"
                        pKeyFilter="alphanum"
                        pInputText
                        placeholder="File Id"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-3">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="pi pi-user"></i
                    ></span>
                    <input
                        type="text"
                        pKeyFilter="alphanum"
                        pInputText
                        placeholder="First Name"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-3">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="pi pi-user"></i
                    ></span>
                    <input
                        type="text"
                        pKeyFilter="alphanum"
                        pInputText
                        placeholder="Middle Name"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-3">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="pi pi-user"></i
                    ></span>
                    <input
                        type="text"
                        pKeyFilter="alphanum"
                        pInputText
                        placeholder="Last Name"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="fa fa-envelope"></i
                    ></span>
                    <input type="text" pInputText placeholder="Email" />
                </div>
            </div>
            <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="fa fa-phone"></i
                    ></span>
                    <input
                        type="text"
                        pInputText
                        pKeyFilter="int"
                        placeholder="Phone"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-4">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Date Of Birth"
                    [showIcon]="true"
                ></p-calendar>
            </div>
            <div class="ui-g-12 ui-md-4">
                <p-dropdown
                    [options]="gender"
                    placeholder="Select Gender"
                    optionLabel="name"
                    [showClear]="true"
                ></p-dropdown>
            </div>
            <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="pi pi-globe"></i
                    ></span>
                    <input
                        type="text"
                        pKeyFilter="alphanum"
                        pInputText
                        placeholder="Country"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="fa fa-building"></i
                    ></span>
                    <input
                        type="text"
                        pKeyFilter="alphanum"
                        pInputText
                        placeholder="City"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-10">
                <div class="ui-inputgroup">
                    <span class="ui-inputgroup-addon backgroundColor"
                        ><i class="pi pi-map-marker"></i
                    ></span>
                    <input
                        type="text"
                        pKeyFilter="alphanum"
                        pInputText
                        placeholder="Address"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-2">
                <button
                    pButton
                    type="button"
                    label="next"
                    (click)="goToNext()"
                    style="margin-bottom: 10px;"
                    class="ui-button-icon-primary ui-button-raised"
                ></button>
            </div>
        </div>
    </p-tabPanel>
    <p-tabPanel header="Medical Information" [disabled]="show">

            <div class="ui-g-12 ui-md-4">

            <div class="ui-g-12 ui-md-2">
