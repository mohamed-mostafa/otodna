<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-confirmDialog
    [style]="{ width: '50vw' }"
    [position]="position"
></p-confirmDialog>
<div class="ui-g ui-fluid" *ngIf="selectedSession.ended === 'false'">
    <div class="ui-g-12 ui-md-10"></div>
    <div class="ui-g-12 ui-md-2" *ngIf="showAllButtons">
        <button
            pButton
            type="button"
            label="End Session"
            (click)="endSession()"
            class="ui-button-danger ui-button-raised"
        ></button>
    </div>
</div>
<p-dialog
    [header]="dialogHeader"
    [(visible)]="displayTest"
    [style]="{ width: '90vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="reset()"
>
    <div style="height: 550px">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12" *ngIf="showTests">
                <div class="ui-g-12 ui-md-12">
                    <p-autoComplete
                        [(ngModel)]="selectedTreatment"
                        (completeMethod)="filterTreatment($event)"
                        field="name"
                        placeholder="Start typing to filter ..."
                        [size]="30"
                        [minLength]="1"
                    ></p-autoComplete>
                </div>
                <div
                    *ngIf="
                        filteredTreatments && filteredTreatments.length > 0;
                        else other
                    "
                >
                    <div
                        class="ui-g-12 ui-md-3"
                        *ngFor="let filtered of filteredTreatments"
                        (click)="openTest(filtered)"
                    >
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '60px' }"
                            styleClass="ui-card-shadow cardBorderRadius"
                        >
                            {{ filtered.treatmentName }}
                        </p-card>
                    </div>
                </div>
                <ng-template #other>
                    <div
                        class="ui-g-12 ui-md-3"
                        *ngFor="let treatment of allTreatments"
                        (click)="openTest(treatment)"
                    >
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '60px' }"
                            styleClass="ui-card-shadow cardBorderRadius"
                        >
                            {{ treatment.treatmentName }}
                        </p-card>
                    </div>
                </ng-template>
            </div>
            <div class="ui-g-12 ui-md-12" *ngIf="!showTests">
                <div
                    class="ui-g ui-fluid"
                    *ngFor="let treatment of selectedTestData"
                >
                    <app-test-parameters
                        [parameters]="treatment.parameters"
                        [savedRightFiles]="savedRightFiles"
                        [savedLeftFiles]="savedLeftFiles"
                        [rightFilePath]="rightFilePath"
                        [leftFilePath]="leftFilePath"
                        [savedRightImage]="savedRightImage"
                        [savedLeftImage]="savedLeftImage"
                    ></app-test-parameters>
                    <div class="ui-g-12 ui-md-8"></div>
                    <div class="ui-g-12 ui-md-4" *ngIf="showSaveButton">
                        <p-footer *ngIf="showAllButtons">
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="reset()"
                                    label="Cancel"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    *ngIf="!showTests"
                                    type="submit"
                                    pButton
                                    (click)="saveTreatment()"
                                    icon="pi pi-check"
                                    label="Ok"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                        </p-footer>
                    </div>
                    <div class="ui-g-12 ui-md-4" *ngIf="!showSaveButton">
                        <p-footer *ngIf="showAllButtons">
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="reset()"
                                    label="Cancel"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    *ngIf="!showTests"
                                    type="submit"
                                    pButton
                                    (click)="updateTreatment()"
                                    icon="pi pi-check"
                                    label="Update"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                        </p-footer>
                    </div>
                </div>
            </div>
        </div>
    </div>
</p-dialog>
<p-dialog
    [header]="addEquipmentDialogHeader"
    [(visible)]="displayEquipmentTest"
    [style]="{ width: '90vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="resetEquipment()"
>
    <div style="height: 550px">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12" *ngIf="showEquipments">
                <div class="ui-g-12 ui-md-12">
                    <p-autoComplete
                        [(ngModel)]="selectedEquipments"
                        (completeMethod)="filterEquipments($event)"
                        placeholder="Start typing to filter ..."
                        [size]="30"
                        [minLength]="1"
                    >
                    </p-autoComplete>
                </div>
                <div
                    *ngIf="
                        filteredEquipments && filteredEquipments.length > 0;
                        else other
                    "
                >
                    <div
                        class="ui-g-12 ui-md-3"
                        *ngFor="let filtered of filteredEquipments"
                        (click)="openEquipment(filtered)"
                    >
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '60px' }"
                            styleClass="ui-card-shadow cardBorderRadius"
                        >
                            {{ filtered.equipmentName }}
                        </p-card>
                    </div>
                </div>
                <ng-template #other>
                    <div
                        class="ui-g-12 ui-md-3"
                        *ngFor="let equipment of allEquipments"
                        (click)="openEquipment(equipment)"
                    >
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '60px' }"
                            styleClass="ui-card-shadow cardBorderRadius"
                        >
                            {{ equipment.equipmentName }}
                        </p-card>
                    </div>
                </ng-template>
            </div>
            <div class="ui-g-12 ui-md-12" *ngIf="!showEquipments">
                <div
                    class="ui-g ui-fluid"
                    *ngFor="let equip of selectedEquipmentData"
                >
                    <app-equipment-test-parameters
                        [parameters]="equip.parameters"
                        [savedRightFiles]="savedRightFiles"
                        [savedLeftFiles]="savedLeftFiles"
                        [rightFilePath]="rightFilePath"
                        [leftFilePath]="leftFilePath"
                        [savedRightImage]="savedRightImage"
                        [savedLeftImage]="savedLeftImage"
                    ></app-equipment-test-parameters>
                    <div class="ui-g-12 ui-md-8"></div>
                    <div class="ui-g-12 ui-md-4">
                        <p-footer *ngIf="showAllButtons">
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="displayEquipmentTest = false"
                                    label="Cancel"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                            <div
                                class="ui-g-12 ui-md-6"
                                *ngIf="showSaveEquipmentButton"
                            >
                                <button
                                    type="submit"
                                    pButton
                                    (click)="saveEquipment()"
                                    icon="pi pi-check"
                                    label="Save"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                            <div
                                class="ui-g-12 ui-md-6"
                                *ngIf="!showSaveEquipmentButton"
                            >
                                <button
                                    type="submit"
                                    pButton
                                    (click)="updateEquipment()"
                                    icon="pi pi-check"
                                    label="Update"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                        </p-footer>
                    </div>
                </div>
            </div>
        </div>
    </div>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Treatment Tests</h2></div>
    <div class="ui-g-6 ui-md-4" *ngFor="let treatment of treatments">
        <p-card
            class="centerHeader pointerCursor"
            [style]="{ height: '100px' }"
            styleClass="ui-card-shadow"
        >
            <p-header *ngIf="showAllButtons">
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteTreatment(treatment)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-header>
            <div>
                <div
                    class="ui-g-12 ui-md-12 bold"
                    (click)="retrieveTestData(treatment)"
                >
                    {{ treatment.treatmentName }}
                </div>
                <div
                    class="ui-g-12 ui-md-6 bold equipmentColor equipmentSpan"
                    (click)="showEquipmentDialog(treatment)"
                    *ngIf="treatment.showEquipment"
                >
                    <i class="fa fa-plus" aira-hidden="true"></i> Add Equipment
                </div>
                <div
                    class="ui-g-12 ui-md-6 bold equipmentColor equipmentSpan"
                    (click)="viewEquipments(treatment)"
                    *ngIf="treatment.showEquipment"
                >
                    <i class="fa fa-desktop" aira-hidden="true"></i>
                    Equipment<span
                        *ngIf="
                            treatment.equipmentCount &&
                            treatment.equipmentCount > 1
                        "
                        >s</span
                    >
                    ({{ treatment.equipmentCount }})
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-6 ui-md-4" *ngIf="showAllButtons">
        <div style="border-style: dotted">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '95px' }"
                (click)="showTestDialog()"
            >
                <div class="addTestStyle">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin-top: 20px"
                    ></i>
                    Add Treatment
                </div>
            </p-card>
        </div>
    </div>
</div>
<p-dialog
    [header]="viewEquipmentDialogHeader"
    [(visible)]="showViewEquipments"
    [style]="{ width: '70vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="resetEquipment()"
>
    <div style="height: 150px">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <div
                    class="ui-g-12 ui-md-4"
                    *ngFor="let equipment of viewedEquipments"
                >
                    <p-card
                        class="centerHeader pointerCursor"
                        [style]="{ height: '60px' }"
                        styleClass="ui-card-shadow cardBorderRadius"
                    >
                        <p-header *ngIf="showAllButtons">
                            <a
                                href="javascript:void(0)"
                                class="iconStyle"
                                (click)="deleteEquipment(equipment, 'top')"
                                title="Remove"
                            >
                                <i class="fa fa-trash-o" aria-hidden="true"></i>
                            </a>
                        </p-header>
                        <div (click)="retrieveEquipmentData(equipment)">
                            {{ equipment.equipmentName }}
                        </div>
                    </p-card>
                </div>
            </div>
        </div>
    </div>
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-10"></div>
        <div class="ui-g-12 ui-md-2">
            <p-footer>
                <button
                    type="button"
                    pButton
                    icon="pi pi-times"
                    (click)="showViewEquipments = false"
                    label="Cancel"
                    class="ui-button-danger"
                ></button>
            </p-footer>
        </div>
    </div>
</p-dialog>
<ngx-spinner></ngx-spinner>
