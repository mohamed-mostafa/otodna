<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<app-patient-summary></app-patient-summary>
<div class="ui-g" *ngIf="showAllButtons && selectedSession.ended === 'false'">
    <div class="ui-g-12">
        <div class="card">
            <h1>Upload Documents</h1>
            <p-fileUpload
                multiple="multiple"
                maxFileSize="100000000"
                customUpload="true"
                name="file"
                ngDefaultControl
                [(ngModel)]="file"
                (uploadHandler)="uploadFiles($event)"
            >
            </p-fileUpload>
        </div>
    </div>
</div>
<div class="ui-g ui-fluid">
    <div class="ui-g-3" *ngFor="let document of allDocuments">
        <p-card
            class="centerHeader"
            [style]="{ height: '120px' }"
            styleClass="ui-card-shadow"
        >
            <div (click)="viewDocument(document)" class="pointerCursor height">
                <div class="ui-g-12 ui-md-12 bold">
                    <div class="ui-g-12 ui-md-2">
                        <app-files-icons [key]="document.Key"></app-files-icons>
                    </div>
                    <div class="ui-g-12 ui-md-10">
                        {{ removeKey(document.Key) }}
                        <br />
                        {{ formatBytes(document.Size) }}
                    </div>
                </div>
            </div>
            <p-footer
                *ngIf="showAllButtons && selectedSession.ended === 'false'"
            >
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteDocument(document)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-footer>
        </p-card>
    </div>
</div>
<ngx-spinner type="ball-fussion" color="#61b5a1"></ngx-spinner>
