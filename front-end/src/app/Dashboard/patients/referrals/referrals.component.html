<p-toast></p-toast>
<app-patient-breadcrumb
    [firstName]="selectedPatient.firstName"
    [lastName]="selectedPatient.lastName"
></app-patient-breadcrumb>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<app-patient-summary></app-patient-summary>
<p-dialog
    header="Referral Patient"
    [(visible)]="displayBasic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <div style="height: 250px">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <div class="ui-inputgroup">
                    <p-dropdown
                        [options]="allTeams"
                        placeholder="Select Team"
                        optionLabel="displayName"
                        id="team"
                        [showClear]="true"
                        [(ngModel)]="referralPatient.teamId"
                        [readonly]="!showSaveButton"
                    ></p-dropdown>
                </div>
            </div>
            <div class="ui-g-12 ui-md-12">
                <div class="ui-inputgroup">
                    <textarea
                        [rows]="5"
                        [cols]="30"
                        pInputTextarea
                        autoResize="autoResize"
                        placeholder="Message"
                        [(ngModel)]="referralPatient.referralMessage"
                        [readonly]="!showSaveButton"
                    ></textarea>
                </div>
            </div>
        </div>
    </div>
    <p-footer *ngIf="showAllButtons">
        <ng-container *ngIf="showSaveButton; else elseTemplate">
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="save()"
                label="Save"
            ></button
        ></ng-container>
        <ng-template #elseTemplate>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="displayBasic = false"
                label="Ok"
            ></button
        ></ng-template>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-3" *ngFor="let referral of referrals">
        <p-card
            class="centerHeader"
            [style]="{ height: '95px' }"
            styleClass="ui-card-shadow"
        >
            <div (click)="viewData(referral)" class="pointerCursor">
                <div class="ui-g-12 ui-md-12 bold">
                    {{ referral.teamName }}
                </div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ referral.active === "true" ? "Active" : "Inactive" }}
                    Since
                    {{ referral.date | date }}
                </div>
            </div>
            <p-footer *ngIf="showAllButtons">
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="menu.toggle($event); onClickMenu(referral)"
                    title="Settings"
                >
                    <i class="fa fa-cog" aria-hidden="true"></i>
                </a>
                <p-menu #menu [popup]="true" [model]="cogsItems"></p-menu>
            </p-footer>
        </p-card>
    </div>
    <div class="ui-g-3" *ngIf="showAllButtons">
        <div style="border-style: dotted">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '90px' }"
                (click)="showDialog()"
            >
                <h3 style="margin-top: 20px">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px"
                    ></i>
                    Add Referral
                </h3>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
