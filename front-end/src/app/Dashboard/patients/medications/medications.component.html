<p-toast></p-toast>
<app-patient-breadcrumb
    [firstName]="selectedPatient.firstName"
    [lastName]="selectedPatient.lastName"
></app-patient-breadcrumb
><p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<app-patient-summary></app-patient-summary>
<p-dialog
    header="Medication"
    [(visible)]="displayBasic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <p-card [style]="{ height: '300px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-6">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Medication"
                        [(ngModel)]="medication.medication"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <p-calendar
                    selectionMode="range"
                    [readonlyInput]="true"
                    placeholder="Start , End Date"
                    [(ngModel)]="date"
                    [showIcon]="true"
                    showButtonBar="true"
                ></p-calendar>
            </div>
            <div class="ui-g-12 ui-md-3">
                <div class="ui-inputgroup">
                    <input
                        type="number"
                        pInputText
                        pKeyFilter="int"
                        placeholder="Quantity"
                        [(ngModel)]="medication.quantity"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-3">
                <p-dropdown
                    [options]="statuses"
                    placeholder="Select Status"
                    optionLabel="name"
                    [showClear]="true"
                    [(ngModel)]="status"
                ></p-dropdown>
            </div>
            <div class="ui-g-12 ui-md-6">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Noted Date"
                    [showIcon]="true"
                    [(ngModel)]="medication.notedDate"
                    showButtonBar="true"
                ></p-calendar>
            </div>
            <div class="ui-g-12 ui-md-12">
                <textarea
                    [rows]="5"
                    [cols]="30"
                    pInputTextarea
                    autoResize="autoResize"
                    placeholder="Comment"
                    [(ngModel)]="medication.comment"
                ></textarea>
            </div>
        </div>
    </p-card>
    <p-footer *ngIf="showAllButtons">
        <ng-container *ngIf="showSaveButton; else elseTemplate">
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="save()"
                label="Save"
            ></button
        ></ng-container>
        <ng-template #elseTemplate>
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="update()"
                label="Update"
            ></button
        ></ng-template>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Patient Medications</h2></div>
    <div class="ui-g-3" *ngFor="let medication of medications">
        <p-card
            class="centerHeader"
            [style]="{ height: '160px' }"
            styleClass="ui-card-shadow"
        >
            <p-header *ngIf="showAllButtons">
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteMedication(medication)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-header>
            <div (click)="viewData(medication)" class="pointerCursor">
                <div class="ui-g-12 ui-md-12 bold">
                    {{ medication.medication }}
                </div>
                <div class="ui-g-12 ui-md-6 bold">
                    {{ medication.startDate | date }}
                </div>
                <div class="ui-g-12 ui-md-6 bold">
                    {{ medication.endDate | date }}
                </div>
                <div class="ui-g-12 ui-md-6 bold">
                    {{ medication.quantity }}
                </div>
                <div class="ui-g-12 ui-md-6 bold">
                    {{ medication.statusName }}
                </div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ medication.notedDate | date }}
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-3" *ngIf="showAllButtons">
        <div style="border-style: dotted">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '155px' }"
                (click)="showDialog()"
            >
                <h3 style="margin-top: 30px">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px"
                    ></i>
                    Add Medication
                </h3>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
