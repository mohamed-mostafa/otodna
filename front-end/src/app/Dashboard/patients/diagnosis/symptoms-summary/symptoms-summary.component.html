<div class="summary ui-g-12 ui-md-12" *ngIf="symptoms && symptoms.length > 0">
    <div class="centerSummary">Summary</div>
    <ul>
        <li class="ui-g-12 ui-md-6" *ngFor="let symptom of symptoms">
            {{ symptom.name }}
        </li>
    </ul>
</div>
<div class="summary ui-g-12 ui-md-12" style="text-align: center;" *ngIf="selectedSession.ended == 'true' && symptoms.length == 0">
    <b>No symptoms were recorded for this session.</b>
</div>
