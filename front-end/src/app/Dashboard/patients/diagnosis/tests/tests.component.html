<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<app-patient-summary></app-patient-summary>
<p-confirmDialog
    [style]="{ width: '50vw' }"
    [position]="position"
></p-confirmDialog>
<ng-container *ngIf="displayTest; else elseShowTestsData">
    <div class="cardMargin">
        <p-card>
            <p-header>
                <p-breadcrumb
                    [model]="testBreadCrumb"
                    [home]="home"
                ></p-breadcrumb>
            </p-header>
            <div>
                <div class="ui-g ui-fluid">
                    <div class="ui-g-12 ui-md-10" *ngIf="showTests">
                        <div class="ui-g-12 ui-md-12">
                            <p-autoComplete
                                [(ngModel)]="selectedTest"
                                (completeMethod)="filterTest($event)"
                                field="name"
                                placeholder="Start typing to filter ..."
                                [size]="30"
                                [minLength]="1"
                            ></p-autoComplete>
                        </div>
                        <div
                            *ngIf="
                                filteredTests && filteredTests.length > 0;
                                else other
                            "
                        >
                            <div
                                class="ui-g-12 ui-md-3"
                                *ngFor="let filtered of filteredTests"
                                (click)="openTest(filtered)"
                            >
                                <p-card
                                    class="centerHeader pointerCursor"
                                    [style]="{ height: '60px' }"
                                    styleClass="ui-card-shadow cardBorderRadius"
                                >
                                    {{ filtered.testName }}
                                </p-card>
                            </div>
                        </div>
                        <ng-template #other>
                            <div
                                class="ui-g-12 ui-md-3"
                                *ngFor="let test of allTests"
                                (click)="openTest(test)"
                            >
                                <p-card
                                    class="centerHeader pointerCursor"
                                    [style]="{ height: '60px' }"
                                    styleClass="ui-card-shadow cardBorderRadius"
                                >
                                    {{ test.testName }}
                                </p-card>
                            </div>
                        </ng-template>
                    </div>
                    <div
                        class="ui-g-12 ui-md-2 frequentlyUsedDiv"
                        *ngIf="showTests"
                    >
                        <span class="frequentlyUsed"> Frequently Used </span>
                        <app-frequently-used
                            [type]="'test'"
                            (frequentlyUsedEvent)="selectFrequentlyUsed($event)"
                        ></app-frequently-used>
                    </div>
                    <div class="ui-g-12 ui-md-12" *ngIf="!showTests">
                        <div
                            class="ui-g ui-fluid"
                            *ngFor="let test of selectedTestData"
                        >
                            <app-test-parameters
                                [parameters]="test.parameters"
                                [rightFilePath]="rightFilePath"
                                [leftFilePath]="leftFilePath"
                                [showDialogLeftData]="showDialogLeftData"
                                [showDialogRightData]="showDialogRightData"
                                [readonly]="readonly"
                                class="width100"
                            ></app-test-parameters>
                        </div>
                        <div
                            class="card ui-g-12 ui-md-12"
                            *ngIf="showEquipments"
                        >
                            <div
                                [ngClass]="
                                    !selectedEquipment
                                        ? 'ui-g-12 ui-md-12'
                                        : 'ui-g-12 ui-md-10'
                                "
                                *ngIf="showEquipments"
                            >
                                <label for="selectedEquipment"
                                    >Equipments</label
                                >
                                <div class="labelMarginTop">
                                    <p-dropdown
                                        [options]="retrievedEquipments"
                                        [(ngModel)]="selectedEquipment"
                                        id="selectedEquipment"
                                        placeholder="Select Equipment"
                                        optionLabel="displayName"
                                        [showClear]="true"
                                    ></p-dropdown>
                                </div>
                            </div>
                            <div
                                *ngIf="selectedEquipment"
                                class="ui-g-12 ui-md-2 marginTop25"
                            >
                                <a
                                    (click)="showViewDetailsDialog()"
                                    class="viewDetailsStyle"
                                >
                                    <i class="fa fa-desktop"></i> View Details
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <p-footer>
                <div class="ui-g ui-fluid footer">
                    <div class="ui-g-12 ui-md-8" *ngIf="showTests"></div>
                    <div class="ui-g-12 ui-md-2" *ngIf="showTests">
                        <button
                            type="button"
                            pButton
                            icon="pi pi-times"
                            (click)="showDiagnosisTests()"
                            label="Back"
                            *ngIf="showAllButtons"
                            class="ui-button-secondary"
                        ></button>
                    </div>
                    <div class="ui-g-12 ui-md-2" *ngIf="showTests"></div>
                    <div class="ui-g-12 ui-md-8" *ngIf="!showTests"></div>
                    <div
                        class="ui-g-12 ui-md-4"
                        *ngIf="showSaveButton && !showTests"
                    >
                        <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                            <button
                                type="button"
                                pButton
                                icon="pi pi-times"
                                (click)="showSearchTests()"
                                label="Back"
                                class="ui-button-secondary"
                            ></button>
                        </div>
                        <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                            <button
                                *ngIf="!showTests"
                                type="submit"
                                pButton
                                (click)="saveTest()"
                                icon="pi pi-check"
                                label="Save"
                                class="ui-button-icon-primary"
                            ></button>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-md-4" *ngIf="!showSaveButton">
                        <p-footer
                            *ngIf="
                                showAllButtons &&
                                selectedSession.ended === 'false'
                            "
                        >
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="reset()"
                                    label="Cancel"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    *ngIf="!showTests"
                                    type="submit"
                                    pButton
                                    (click)="updateTest()"
                                    icon="pi pi-check"
                                    label="Update"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                        </p-footer>
                        <p-footer *ngIf="selectedSession.ended === 'true'">
                            <div class="ui-g-12 ui-md-6"></div>
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="showDiagnosisTests()"
                                    label="Close"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                        </p-footer>
                    </div>
                    <div
                        class="ui-g-12 ui-md-2"
                        *ngIf="!showTests || !showSaveButton"
                    ></div>
                </div>
            </p-footer>
        </p-card>
    </div>
</ng-container>
<ng-template #elseShowTestsData>
    <div class="ui-g ui-fluid">
        <ng-container
            *ngIf="
                (rightTests && rightTests.length > 0) ||
                    (leftTests && leftTests.length > 0) ||
                    selectedSession.ended === 'false';
                else elseNoDataToDisplay
            "
        >
            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                <h2 class="centerHeader removeMarginAndPadding rightColor">
                    R
                </h2>
                <div
                    class="ui-g-12 ui-md-12 rightFloat"
                    *ngFor="let right of rightTests"
                >
                    <div class="rightCardBorder">
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '100px' }"
                            styleClass="ui-card-shadow "
                        >
                            <div
                                (click)="retrieveTestData(right)"
                                class="height50"
                            >
                                <div class="ui-g-12 ui-md-12 bold">
                                    {{ right.testName }}
                                </div>
                            </div>
                            <p-footer
                                *ngIf="
                                    showAllButtons &&
                                    selectedSession.ended === 'false'
                                "
                            >
                                <a
                                    href="javascript:void(0)"
                                    class="iconStyle"
                                    (click)="deleteTest(right)"
                                    title="Remove"
                                >
                                    <i
                                        class="fa fa-trash-o"
                                        aria-hidden="true"
                                    ></i>
                                </a>
                            </p-footer>
                        </p-card>
                    </div>
                </div>
                <div
                    class="ui-g-12 ui-md-12 rightFloat"
                    *ngIf="showAllButtons && selectedSession.ended === 'false'"
                >
                    <div style="border-style: dotted" class="rightCardBorder">
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '95px' }"
                            (click)="showRightTestDialog()"
                        >
                            <div class="addTestStyle">
                                <i
                                    class="fa fa-plus"
                                    aira-hidden="true"
                                    style="margin: 5px"
                                ></i>
                                Add Test
                            </div>
                        </p-card>
                    </div>
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <h2 class="centerHeader removeMarginAndPadding leftColor">L</h2>
                <div
                    class="ui-g-12 ui-md-12 leftFloat"
                    *ngFor="let left of leftTests"
                >
                    <div class="leftCardBorder">
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '100px' }"
                            styleClass="ui-card-shadow"
                        >
                            <div
                                (click)="retrieveTestData(left)"
                                class="height50"
                            >
                                <div class="ui-g-12 ui-md-12 bold">
                                    {{ left.testName }}
                                </div>
                            </div>
                            <p-footer
                                *ngIf="
                                    showAllButtons &&
                                    selectedSession.ended === 'false'
                                "
                            >
                                <a
                                    href="javascript:void(0)"
                                    class="iconStyle"
                                    (click)="deleteTest(left)"
                                    title="Remove"
                                >
                                    <i
                                        class="fa fa-trash-o"
                                        aria-hidden="true"
                                    ></i>
                                </a>
                            </p-footer>
                        </p-card>
                    </div>
                </div>
                <div
                    class="ui-g-12 ui-md-12 leftFloat"
                    *ngIf="showAllButtons && selectedSession.ended === 'false'"
                >
                    <div style="border-style: dotted" class="leftCardBorder">
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '95px' }"
                            (click)="showLeftTestDialog()"
                        >
                            <div class="addTestStyle">
                                <i
                                    class="fa fa-plus"
                                    aira-hidden="true"
                                    style="margin: 5px"
                                ></i>
                                Add Test
                            </div>
                        </p-card>
                    </div>
                </div>
            </div>
        </ng-container>
        <ng-template #elseNoDataToDisplay>
            <span class="noDataToDisplay"
                >No tests were recorded for this session.</span
            >
        </ng-template>
    </div>
</ng-template>
<p-dialog
    header="View Equipment Details"
    [style]="{ width: '55vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [(visible)]="displayViewDetailsDialog"
>
    <div style="height: 250px">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <label for="equipmentName">Equipment Name</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        pInputText
                        id="equipmentName"
                        placeholder="equipmentName"
                        readonly="true"
                        [(ngModel)]="diagnosisEquipment.equipmentName"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-12">
                <label for="manufacturerName">Manufacturer Name</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        pInputText
                        placeholder="manufacturerName"
                        readonly="true"
                        id="manufacturerName"
                        [(ngModel)]="diagnosisEquipment.manufacturerName"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-12">
                <label for="serialNumber">Serial Number</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        pInputText
                        placeholder="serialNumber"
                        readonly="true"
                        id="serialNumber"
                        [(ngModel)]="diagnosisEquipment.serialNumber"
                    />
                </div>
            </div>
        </div>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="displayViewDetailsDialog = false"
            label="Ok"
            class="ui-button-primary"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner type="ball-fussion" color="#61b5a1"></ngx-spinner>
