<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<div class="ui-g ui-fluid" *ngIf="selectedSession.ended === 'false'">
    <div class="ui-g-12 ui-md-10"></div>
    <div class="ui-g-12 ui-md-2" *ngIf="showAllButtons">
        <button
            pButton
            type="button"
            label="End Session"
            (click)="endSession()"
            class="ui-button-danger ui-button-raised"
        ></button>
    </div>
</div>
<p-dialog
    [header]="dialogHeader"
    [(visible)]="displayTest"
    [style]="{ width: '70vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <div style="height: 350px">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12" *ngIf="showTests">
                <div class="ui-g-12 ui-md-12">
                    <p-autoComplete
                        [(ngModel)]="selectedTest"
                        (completeMethod)="filterTest($event)"
                        field="name"
                        placeholder="Start typing to filter ..."
                        [size]="30"
                        [minLength]="1"
                    ></p-autoComplete>
                </div>
                <div
                    *ngIf="
                        filteredTests && filteredTests.length > 0;
                        else other
                    "
                >
                    <div
                        class="ui-g-12 ui-md-3"
                        *ngFor="let filtered of filteredTests"
                        (click)="openTest(filtered)"
                    >
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '60px' }"
                            styleClass="ui-card-shadow cardBorderRadius"
                        >
                            {{ filtered.testName }}
                        </p-card>
                    </div>
                </div>
                <ng-template #other>
                    <div
                        class="ui-g-12 ui-md-3"
                        *ngFor="let test of allTests"
                        (click)="openTest(test)"
                    >
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '60px' }"
                            styleClass="ui-card-shadow cardBorderRadius"
                        >
                            {{ test.testName }}
                        </p-card>
                    </div>
                </ng-template>
            </div>
            <div class="ui-g-12 ui-md-12" *ngIf="!showTests">
                <div
                    class="ui-g ui-fluid"
                    *ngFor="let test of selectedTestData"
                >
                    <div class="ui-g-12 ui-md-6 rightVerticalLine">
                        <h2
                            class="centerHeader removeMarginAndPadding rightColor"
                        >
                            R
                        </h2>
                    </div>
                    <div class="ui-g-12 ui-md-6">
                        <h2
                            class="centerHeader removeMarginAndPadding leftColor"
                        >
                            L
                        </h2>
                    </div>
                    <div
                        *ngFor="let t of test.parameters"
                        class="ui-g-12 ui-md-12 removeMarginAndPadding"
                    >
                        <div
                            class="ui-g-12 ui-md-12 removeMarginAndPadding"
                            *ngIf="t.type === 'text'"
                        >
                            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                                <label for="right-{{ t.name }}">{{
                                    t.name
                                }}</label>
                                <div class="ui-inputgroup labelMarginTop">
                                    <span
                                        class="ui-inputgroup-addon rightBackgroundColor"
                                        >R</span
                                    >
                                    <input
                                        type="text"
                                        pInputText
                                        id="right-{{ t.name }}"
                                        [placeholder]="t.name"
                                        [required]="t.required"
                                        [(ngModel)]="t.rightVal"
                                    />
                                </div>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <label for="left-{{ t.name }}">{{
                                    t.name
                                }}</label>
                                <div class="ui-inputgroup labelMarginTop">
                                    <span
                                        class="ui-inputgroup-addon leftBackgroundColor"
                                        >L</span
                                    >
                                    <input
                                        type="text"
                                        pInputText
                                        id="left-{{ t.name }}"
                                        [placeholder]="t.name"
                                        [required]="t.required"
                                        [(ngModel)]="t.leftVal"
                                    />
                                </div>
                            </div>
                        </div>
                        <div
                            class="ui-g-12 ui-md-12 removeMarginAndPadding"
                            *ngIf="t.type === 'number'"
                        >
                            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                                <label for="right-{{ t.name }}">
                                    {{ t.name }}</label
                                >
                                <div class="ui-inputgroup labelMarginTop">
                                    <span
                                        class="ui-inputgroup-addon rightBackgroundColor"
                                        >R</span
                                    >
                                    <input
                                        type="number"
                                        pInputText
                                        id="right-{{ t.name }}"
                                        [placeholder]="t.name"
                                        [required]="t.required"
                                        [(ngModel)]="t.rightVal"
                                    />
                                    <span class="ui-inputgroup-addon">{{
                                        t.unit ? t.unit : ""
                                    }}</span>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <label for="left-{{ t.name }}">
                                    {{ t.name }}</label
                                >
                                <div class="ui-inputgroup labelMarginTop">
                                    <span
                                        class="ui-inputgroup-addon leftBackgroundColor"
                                        >L</span
                                    >
                                    <input
                                        type="number"
                                        pInputText
                                        [min]="t.minimum"
                                        [max]="t.maximum"
                                        id="left-{{ t.name }}"
                                        [placeholder]="t.name"
                                        [required]="t.required"
                                        [(ngModel)]="t.leftVal"
                                    />
                                    <span class="ui-inputgroup-addon">
                                        {{ t.unit ? t.unit : "" }}</span
                                    >
                                </div>
                            </div>
                        </div>
                        <div
                            class="ui-g-12 ui-md-12 removeMarginAndPadding"
                            *ngIf="t.type === 'boolean'"
                        >
                            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                                <div class="ui-inputgroup">
                                    <span
                                        class="ui-inputgroup-addon rightBackgroundColor lineHeight"
                                        >R</span
                                    >
                                    <p-checkbox
                                        label=" {{ t.name }}"
                                        [value]="t.name"
                                        [required]="t.required"
                                        [(ngModel)]="t.rightVal"
                                    ></p-checkbox>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <div class="ui-inputgroup">
                                    <span
                                        class="ui-inputgroup-addon leftBackgroundColor lineHeight"
                                        >L</span
                                    >
                                    <p-checkbox
                                        label="{{ t.name }}"
                                        [value]="t.name"
                                        [required]="t.required"
                                        [(ngModel)]="t.leftVal"
                                    ></p-checkbox>
                                </div>
                            </div>
                        </div>
                        <div
                            class="ui-g-12 ui-md-12 removeMarginAndPadding"
                            *ngIf="t.type === 'list'"
                        >
                            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                                <label for="right-{{ t.name }}">
                                    {{ t.name }}</label
                                >
                                <div class="ui-inputgroup labelMarginTop">
                                    <span
                                        class="ui-inputgroup-addon rightBackgroundColor"
                                        >R</span
                                    >
                                    <p-dropdown
                                        [options]="t.values"
                                        placeholder="Select Value"
                                        optionLabel="name"
                                        id="right-{{ t.name }}"
                                        [showClear]="true"
                                        [required]="t.required"
                                        [(ngModel)]="t.rightVal"
                                    ></p-dropdown>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <label for="left-{{ t.name }}">
                                    {{ t.name }}</label
                                >
                                <div class="ui-inputgroup labelMarginTop">
                                    <span
                                        class="ui-inputgroup-addon leftBackgroundColor"
                                        >L</span
                                    >
                                    <p-dropdown
                                        [options]="t.values"
                                        placeholder="Select Value"
                                        optionLabel="name"
                                        id="left-{{ t.name }}"
                                        [showClear]="true"
                                        [required]="t.required"
                                        [(ngModel)]="t.leftVal"
                                    ></p-dropdown>
                                </div>
                            </div>
                        </div>
                        <div
                            class="removeMarginAndPadding"
                            *ngIf="t.type === 'image'"
                        >
                            <ng-container
                                *ngIf="
                                    savedRightFiles.length > 0;
                                    else elseTemplate
                                "
                            >
                                <div class="ui-g-12 ui-md-6 rightVerticalLine">
                                    <label> {{ t.name }}</label>
                                    <div
                                        class="ui-g-12"
                                        *ngFor="let document of savedRightFiles"
                                    >
                                        <p-card
                                            class="centerHeader"
                                            [style]="{ height: '90px' }"
                                            styleClass="ui-card-shadow"
                                        >
                                            <div
                                                (click)="viewDocument(document)"
                                                class="pointerCursor"
                                            >
                                                <div
                                                    class="ui-g-12 ui-md-12 bold"
                                                >
                                                    {{
                                                        removeRightKey(
                                                            document.Key
                                                        )
                                                    }}
                                                </div>
                                            </div>
                                        </p-card>
                                    </div>
                                </div>
                            </ng-container>
                            <ng-template #elseTemplate>
                                <div class="ui-g-12 ui-md-6 rightVerticalLine">
                                    <label for="img">Choose {{ t.name }}</label>
                                    <div class="labelMarginTop">
                                        <p-fileUpload
                                            multiple="multiple"
                                            maxFileSize="100000000"
                                            customUpload="true"
                                            name="file"
                                            ngDefaultControl
                                            [showUploadButton]="false"
                                            (onSelect)="
                                                selectedRightFiles($event)
                                            "
                                        >
                                        </p-fileUpload>
                                    </div>
                                </div>
                            </ng-template>
                            <ng-container
                                *ngIf="
                                    savedLeftFiles.length > 0;
                                    else elseTemplate2
                                "
                            >
                                <div class="ui-g-12 ui-md-6">
                                    <label> {{ t.name }}</label>
                                    <div
                                        class="ui-g-12"
                                        *ngFor="let document of savedLeftFiles"
                                    >
                                        <p-card
                                            class="centerHeader"
                                            [style]="{ height: '90px' }"
                                            styleClass="ui-card-shadow"
                                        >
                                            <div
                                                (click)="viewDocument(document)"
                                                class="pointerCursor"
                                            >
                                                <div
                                                    class="ui-g-12 ui-md-12 bold"
                                                >
                                                    {{
                                                        removeLeftKey(
                                                            document.Key
                                                        )
                                                    }}
                                                </div>
                                            </div>
                                        </p-card>
                                    </div>
                                </div>
                            </ng-container>
                            <ng-template #elseTemplate2>
                                <div class="ui-g-12 ui-md-6">
                                    <label for="img">Choose {{ t.name }}</label>
                                    <div class="labelMarginTop">
                                        <p-fileUpload
                                            multiple="multiple"
                                            maxFileSize="100000000"
                                            customUpload="true"
                                            name="file"
                                            ngDefaultControl
                                            [showUploadButton]="false"
                                            (onSelect)="
                                                selectedLeftFiles($event)
                                            "
                                        >
                                        </p-fileUpload>
                                    </div>
                                </div>
                            </ng-template>
                        </div>

                            class="removeMarginAndPadding"
                            *ngIf="t.type === 'file'"
                        >
                            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                                <label for="img">Choose {{ t.name }}</label>
                                <div class="labelMarginTop">

                        <div
                            class="ui-g-12 ui-md-12"
                            *ngIf="t.type === 'textarea'"
                        >
                            <label>{{ t.name }}</label>
                            <div class="labelMarginTop">
                                <textarea
                                    [rows]="5"
                                    [cols]="30"
                                    pInputTextarea
                                    autoResize="autoResize"
                                    [placeholder]="t.name"
                                    [required]="t.required"
                                    [(ngModel)]="t.textareaVal"
                                ></textarea>
                            </div>
                        </div>
                        <div
                            class="ui-g-12 ui-md-12"
                            *ngIf="t.type === 'table'"
                        >
                            <label> {{ t.name }}</label>
                            <div class="labelMarginTop">
                                <p-table>
                                    <ng-template pTemplate="header">
                                        <tr>
                                            <th>{{ t.xAxisName }}</th>
                                            <th *ngFor="let data of t.cells">
                                                {{ data.name }}
                                            </th>
                                        </tr>

                                        <tr>
                                            <th class="rightColor">Right</th>
                                            <ng-container
                                                *ngIf="t.cellType === 'boolean'"
                                            >
                                                <th
                                                    *ngFor="let freq of t.cells"
                                                >
                                                    <p-dropdown
                                                        [options]="t.cellValues"
                                                        placeholder="Y/N"
                                                        optionLabel="name"
                                                        [showClear]="true"
                                                        [(ngModel)]="freq.right"
                                                    ></p-dropdown>
                                                </th>
                                            </ng-container>
                                            <ng-container
                                                *ngIf="t.cellType === 'number'"
                                            >
                                                <th
                                                    *ngFor="let freq of t.cells"
                                                >
                                                    <input
                                                        type="number"
                                                        pInputText
                                                        [(ngModel)]="freq.right"
                                                    />
                                                </th>
                                            </ng-container>
                                        </tr>
                                        <tr>
                                            <th class="leftColor">Left</th>
                                            <ng-container
                                                *ngIf="t.cellType === 'boolean'"
                                            >
                                                <th
                                                    *ngFor="let freq of t.cells"
                                                >
                                                    <p-dropdown
                                                        [options]="t.cellValues"
                                                        placeholder="Y/N"
                                                        optionLabel="name"
                                                        [showClear]="true"
                                                        [(ngModel)]="freq.left"
                                                    ></p-dropdown>
                                                </th>
                                            </ng-container>
                                            <ng-container
                                                *ngIf="t.cellType === 'number'"
                                            >
                                                <th
                                                    *ngFor="let freq of t.cells"
                                                >
                                                    <input
                                                        type="number"
                                                        pInputText
                                                        [(ngModel)]="freq.left"
                                                    />
                                                </th>
                                            </ng-container>
                                        </tr>
                                    </ng-template>
                                </p-table>
                            </div>
                        </div>

                            </div>
                        </div> -->
                    </div>
                    <div class="ui-g-12 ui-md-12">
                        <p-fieldset legend="Equipments">
                            <p-autoComplete
                                id="acAdvanced"
                                [suggestions]="filteredEquipments"
                                (completeMethod)="filterEquipments($event)"
                                [size]="30"
                                [minLength]="1"
                                [dropdown]="true"
                                multiple="true"
                                [(ngModel)]="selectedEquipments"
                            >
                                <ng-template let-equip pTemplate="item">
                                    <div class="ui-helper-clearfix">
                                        <div class="equipmentStyle">
                                            {{ equip }}
                                        </div>
                                    </div>
                                </ng-template>
                            </p-autoComplete>
                        </p-fieldset>
                    </div>

                    <div class="ui-g-12 ui-md-8"></div>
                    <div class="ui-g-12 ui-md-4" *ngIf="showSaveButton">
                        <p-footer>
                            <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="cancelTest()"
                                    label="Cancel"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                            <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                                <button
                                    *ngIf="!showTests"
                                    type="submit"
                                    pButton
                                    (click)="saveTest()"
                                    icon="pi pi-check"
                                    label="Ok"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                        </p-footer>
                    </div>
                    <div class="ui-g-12 ui-md-4" *ngIf="!showSaveButton">
                        <p-footer>
                            <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="cancelTest()"
                                    label="Cancel"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                            <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                                <button
                                    *ngIf="!showTests"
                                    type="submit"
                                    pButton
                                    (click)="updateTest()"
                                    icon="pi pi-check"
                                    label="Update"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                        </p-footer>
                    </div>
                </div>
            </div>
        </div>
    </div>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Diagnosis Tests</h2></div>
    <div class="ui-g-6 ui-md-3" *ngFor="let test of tests">
        <p-card
            class="centerHeader pointerCursor"
            [style]="{ height: '80px' }"
            styleClass="ui-card-shadow"
        >
            <p-header *ngIf="showAllButtons">
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteTest(test)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-header>
            <div (click)="retrieveTestData(test)">
                <div class="ui-g-12 ui-md-12 bold">
                    {{ test.testName }}
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-6 ui-md-3" *ngIf="showAllButtons">
        <div style="border-style: dotted">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '75px' }"
                (click)="showTestDialog()"
            >
                <div class="addTestStyle">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px"
                    ></i>
                    Add Test
                </div>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
