<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid" *ngIf="showTableFlag">
    <div class="ui-g-12 ui-md-3">
        <button
            #btn
            type="button"
            pButton
            icon="pi pi-bars"
            label="Add Test"
            (click)="showTestDialog()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-9"></div>
</div>
<div class="centerClass" *ngIf="!showTableFlag">
    <h3>Click Add Test To Add A New Test</h3>
    <button
        #btn
        type="button"
        pButton
        icon="pi pi-bars"
        label="Add Test"
        (click)="showTestDialog()"
    ></button>
</div>
<p-dialog
    header="Add New Test"
    [(visible)]="displayTest"
    [style]="{ width: '60vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
>
    <div style="height: 300px;">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12" *ngIf="showTests">
                <div class="ui-g-12 ui-md-12">
                    <p-autoComplete
                        [(ngModel)]="selectedTest"
                        (completeMethod)="filterTest($event)"
                        field="name"
                        placeholder="Test Name"
                        [size]="30"
                        [minLength]="1"
                    ></p-autoComplete>
                </div>
                <div
                    class="ui-g-12 ui-md-3"
                    *ngFor="let filtered of filteredTests"
                    (click)="openTest(filtered)"
                >
                    <p-card
                        class="centerHeader pointerCursor"
                        [style]="{ height: '60px' }"
                        styleClass="ui-card-shadow cardBorderRadius"
                    >
                        {{ filtered.name }}
                    </p-card>
                </div>
            </div>
            <div class="ui-g-12 ui-md-12" *ngIf="!showTests">
                <div class="ui-g ui-fluid" *ngFor="let test of acousticTest">
                    <h4 class="centerHeader">{{ test.name }}</h4>
                    <div
                        *ngFor="let t of test.parameters"
                        class="ui-g-12 ui-md-12"
                    >
                        <div class="ui-g-12 ui-md-12" *ngIf="t.type === 'text'">
                            <div class="ui-g-12 ui-md-6">
                                <label for="left-{{ t.name }}"
                                    >Left {{ t.name }}</label
                                >
                                <div class="ui-inputgroup">
                                    <input
                                        type="text"
                                        pInputText
                                        id="left-{{ t.name }}"
                                        class="labelMarginTop"
                                        [placeholder]="t.name"
                                        [required]="t.required"
                                    />
                                </div>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <label for="right-{{ t.name }}"
                                    >Right {{ t.name }}</label
                                >
                                <div class="ui-inputgroup">
                                    <input
                                        type="text"
                                        pInputText
                                        id="right-{{ t.name }}"
                                        class="labelMarginTop"
                                        [placeholder]="t.name"
                                        [required]="t.required"
                                    />
                                </div>
                            </div>
                        </div>
                        <div
                            class="ui-g-12 ui-md-12"
                            *ngIf="t.type === 'number'"
                        >
                            <div class="ui-g-12 ui-md-6">
                                <label for="left-{{ t.name }}"
                                    >Left {{ t.name }}</label
                                >
                                <div class="ui-inputgroup">
                                    <input
                                        type="number"
                                        pInputText
                                        id="left-{{ t.name }}"
                                        class="labelMarginTop"
                                        [placeholder]="t.name"
                                        [required]="t.required"
                                    />
                                </div>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <label for="right-{{ t.name }}"
                                    >Right {{ t.name }}</label
                                >
                                <div class="ui-inputgroup">
                                    <input
                                        type="number"
                                        pInputText
                                        id="right-{{ t.name }}"
                                        class="labelMarginTop"
                                        [placeholder]="t.name"
                                        [required]="t.required"
                                    />
                                </div>
                            </div>
                        </div>
                        <div
                            class="ui-g-12 ui-md-12"
                            *ngIf="t.type === 'boolean'"
                        >
                            <div class="ui-g-12 ui-md-6">
                                <p-checkbox
                                    label="Left {{ t.name }}"
                                    [value]="t.name"
                                    class="labelMarginTop"
                                    [required]="t.required"
                                ></p-checkbox>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <p-checkbox
                                    label="Right {{ t.name }}"
                                    [value]="t.name"
                                    class="labelMarginTop"
                                    [required]="t.required"
                                ></p-checkbox>
                            </div>
                        </div>
                        <div class="ui-g-12 ui-md-12" *ngIf="t.type === 'list'">
                            <div class="ui-g-12 ui-md-6">
                                <label for="left-{{ t.name }}"
                                    >Left {{ t.name }}</label
                                >
                                <div class="ui-inputgroup labelMarginTop">
                                    <p-dropdown
                                        [options]="t.values"
                                        placeholder="Select Value"
                                        optionLabel="name"
                                        id="left-{{ t.name }}"
                                        [showClear]="true"
                                        [required]="t.required"
                                    ></p-dropdown>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <label for="right-{{ t.name }}"
                                    >Right {{ t.name }}</label
                                >
                                <div class="ui-inputgroup labelMarginTop">
                                    <p-dropdown
                                        [options]="t.values"
                                        placeholder="Select Value"
                                        optionLabel="name"
                                        id="right-{{ t.name }}"
                                        [showClear]="true"
                                        [required]="t.required"
                                    ></p-dropdown>
                                </div>
                            </div>
                        </div>
                        <div
                            class="ui-g-12 ui-md-12"
                            *ngIf="t.type === 'textarea'"
                        >
                            <textarea
                                [rows]="5"
                                [cols]="30"
                                pInputTextarea
                                autoResize="autoResize"
                                [placeholder]="t.name"
                                [required]="t.required"
                                [(ngModel)]="t.name"
                            ></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancelTest()"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            *ngIf="!showTests"
            type="button"
            pButton
            icon="pi pi-times"
            (click)="saveTest()"
            label="Ok"
            class="ui-button-icon-primary"
        ></button>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid" *ngIf="showTableFlag">
    <div class="ui-g-12">
        <div class="card card-w-title">
            <p-table
                #dt
                [columns]="cols"
                styleClass="ui-table-cars"
                [value]="tests"
                [paginator]="true"
                [resizableColumns]="true"
                [responsive]="true"
                [rows]="10"
                dataKey="vin"
                selectionMode="single"
            >
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            [pSortableColumn]="col.field"
                            [ngSwitch]="col.field"
                            [ngStyle]="{ width: col.width }"
                        >
                            {{ col.header }}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                        <td class="ui-resizable-column centerHeader">
                            <span class="ui-column-title">Test Id </span>
                            {{ rowData.id }}
                        </td>
                        <td class="ui-resizable-column centerHeader">
                            <span class="ui-column-title">Test Name </span>
                            {{ rowData.name }}
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
