<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<app-patient-summary></app-patient-summary>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<ng-container *ngIf="displayTest; else elseDisplayPathologyTests">
    <div class="cardMargin">
        <p-card>
            <p-header>
                <p-breadcrumb
                    [model]="pathologyBreadCrumb"
                    [home]="home"
                ></p-breadcrumb>
            </p-header>
            <div>
                <div class="ui-g ui-fluid">
                    <div class="ui-g-12 ui-md-10" *ngIf="showTests">
                        <div class="ui-g-12 ui-md-12">
                            <app-search-result-item
                                [allTests]="allTests"
                                (testEvent)="receiveTest($event)"
                                displayName="diseaseName"
                            ></app-search-result-item>
                        </div>
                    </div>
                    <div
                        class="ui-g-12 ui-md-2 frequentlyUsedDiv"
                        *ngIf="showTests"
                    >
                        <span class="frequentlyUsed"> Frequently Used </span>
                        <app-frequently-used
                            [type]="'pathology'"
                            (frequentlyUsedEvent)="selectFrequentlyUsed($event)"
                        ></app-frequently-used>
                    </div>
                    <div class="ui-g-12 ui-md-12" *ngIf="!showTests">
                        <div
                            class="ui-g ui-fluid"
                            *ngFor="let test of selectedTestData"
                        >
                            <app-test-parameters
                                [parameters]="test.parameters"
                                [savedRightFiles]="savedRightFiles"
                                [savedLeftFiles]="savedLeftFiles"
                                [rightFilePath]="rightFilePath"
                                [leftFilePath]="leftFilePath"
                                [savedRightImage]="savedRightImage"
                                [savedLeftImage]="savedLeftImage"
                                [showDialogLeftData]="showDialogLeftData"
                                [showDialogRightData]="showDialogRightData"
                                [readonly]="readonly"
                                class="width100"
                            ></app-test-parameters>
                        </div>
                    </div>
                </div>
            </div>
            <p-footer>
                <div class="ui-g ui-fluid footer">
                    <div class="ui-g-12 ui-md-8" *ngIf="showTests"></div>
                    <div class="ui-g-12 ui-md-2" *ngIf="showTests">
                        <button
                            type="button"
                            pButton
                            icon="pi pi-times"
                            (click)="showDiagnosisPathologies()"
                            label="Cancel"
                            *ngIf="showAllButtons"
                            class="ui-button-secondary"
                        ></button>
                    </div>
                    <div class="ui-g-12 ui-md-2" *ngIf="showTests"></div>
                    <div class="ui-g-12 ui-md-8" *ngIf="!showTests"></div>
                    <div
                        class="ui-g-12 ui-md-4"
                        *ngIf="showSaveButton && !showTests"
                    >
                        <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                            <button
                                type="button"
                                pButton
                                icon="pi pi-times"
                                (click)="showSearchPathologies()"
                                label="Back"
                                class="ui-button-secondary"
                            ></button>
                        </div>
                        <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                            <button
                                *ngIf="!showTests"
                                type="submit"
                                pButton
                                (click)="save()"
                                icon="pi pi-check"
                                label="Save"
                                class="ui-button-icon-primary"
                            ></button>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-md-4" *ngIf="!showSaveButton">
                        <p-footer
                            *ngIf="
                                showAllButtons &&
                                selectedSession.ended === 'false'
                            "
                        >
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="reset()"
                                    label="Cancel"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    *ngIf="!showTests"
                                    type="submit"
                                    pButton
                                    (click)="update()"
                                    icon="pi pi-check"
                                    label="Update"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                        </p-footer>
                        <p-footer *ngIf="selectedSession.ended === 'true'">
                            <div class="ui-g-12 ui-md-6"></div>
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="showDiagnosisPathologies()"
                                    label="Close"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                        </p-footer>
                    </div>
                    <div
                        class="ui-g-12 ui-md-2"
                        *ngIf="!showTests || !showSaveButton"
                    ></div>
                </div>
            </p-footer>
        </p-card>
    </div>
</ng-container>
<ng-template #elseDisplayPathologyTests>
    <div class="ui-g ui-fluid">
        <ng-container
            *ngIf="
                (rightPathologies && rightPathologies.length > 0) ||
                    (leftPathologies && leftPathologies.length > 0) ||
                    selectedSession.ended === 'false';
                else elseNoDataToDisplay
            "
        >
            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                <h2 class="centerHeader removeMarginAndPadding rightColor">
                    R
                </h2>
                <div
                    class="ui-g-12 ui-md-12 rightFloat"
                    *ngFor="let right of rightPathologies"
                >
                    <div class="rightCardBorder">
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '100px' }"
                            styleClass="ui-card-shadow"
                        >
                            <div
                                (click)="retrieveTestData(right, 'right')"
                                class="height50"
                            >
                                <div class="ui-g-12 ui-md-12 bold">
                                    {{ right.diseaseName }}
                                </div>
                            </div>
                            <p-footer
                                *ngIf="
                                    showAllButtons &&
                                    selectedSession.ended === 'false'
                                "
                            >
                                <a
                                    href="javascript:void(0)"
                                    class="iconStyle"
                                    (click)="deletePathology(right)"
                                    title="Remove"
                                >
                                    <i
                                        class="fa fa-trash-o"
                                        aria-hidden="true"
                                    ></i>
                                </a>
                            </p-footer>
                        </p-card>
                    </div>
                </div>
                <div
                    class="ui-g-12 ui-md-12 rightFloat"
                    *ngIf="showAllButtons && selectedSession.ended === 'false'"
                >
                    <div style="border-style: dotted" class="rightCardBorder">
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '95px' }"
                            (click)="showRightPathologyDialog()"
                        >
                            <div class="addTestStyle">
                                <i
                                    class="fa fa-plus"
                                    aira-hidden="true"
                                    style="margin: 5px"
                                ></i>
                                Add Pathology
                            </div>
                        </p-card>
                    </div>
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <h2 class="centerHeader removeMarginAndPadding leftColor">L</h2>
                <div
                    class="ui-g-12 ui-md-12 leftFloat"
                    *ngFor="let left of leftPathologies"
                >
                    <div class="leftCardBorder">
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '100px' }"
                            styleClass="ui-card-shadow"
                        >
                            <div
                                (click)="retrieveTestData(left, 'left')"
                                class="height50"
                            >
                                <div class="ui-g-12 ui-md-12 bold">
                                    {{ left.diseaseName }}
                                </div>
                            </div>
                            <p-footer
                                *ngIf="
                                    showAllButtons &&
                                    selectedSession.ended === 'false'
                                "
                            >
                                <a
                                    href="javascript:void(0)"
                                    class="iconStyle"
                                    (click)="deletePathology(left)"
                                    title="Remove"
                                >
                                    <i
                                        class="fa fa-trash-o"
                                        aria-hidden="true"
                                    ></i>
                                </a>
                            </p-footer>
                        </p-card>
                    </div>
                </div>
                <div
                    class="ui-g-12 ui-md-12 leftFloat"
                    *ngIf="showAllButtons && selectedSession.ended === 'false'"
                >
                    <div style="border-style: dotted" class="leftCardBorder">
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '95px' }"
                            (click)="showLeftPathologyDialog()"
                        >
                            <div class="addTestStyle">
                                <i
                                    class="fa fa-plus"
                                    aira-hidden="true"
                                    style="margin: 5px"
                                ></i>
                                Add Pathology
                            </div>
                        </p-card>
                    </div>
                </div>
            </div>
        </ng-container>
        <ng-template #elseNoDataToDisplay>
            <span class="noDataToDisplay">No pathologies were recorded for this session.</span>
        </ng-template>
    </div>
</ng-template>
<ngx-spinner type="ball-fussion" color="#61b5a1"></ngx-spinner>
