<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-dialog
    header="Add New Pathology"
    [(visible)]="displayTest"
    [style]="{ width: '70vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <div style="height: 350px;">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <div class="ui-g-12 ui-md-12">
                    <p-autoComplete
                        [(ngModel)]="selectedTest"
                        (completeMethod)="filterTest($event)"
                        field="name"
                        placeholder="Start typing to filter ..."
                        [size]="30"
                        [minLength]="1"
                    ></p-autoComplete>
                </div>
                <div
                    *ngIf="
                        filteredTests && filteredTests.length > 0;
                        else other
                    "
                >
                    <div
                        class="ui-g-12 ui-md-3"
                        *ngFor="let filtered of filteredTests"
                        (click)="save(filtered)"
                    >
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '60px' }"
                            styleClass="ui-card-shadow cardBorderRadius"
                        >
                            {{ filtered.name }}
                        </p-card>
                    </div>
                </div>
                <ng-template #other>
                    <div
                        class="ui-g-12 ui-md-3"
                        *ngFor="let test of allTests"
                        (click)="save(test)"
                    >
                        <p-card
                            class="centerHeader pointerCursor"
                            [style]="{ height: '60px' }"
                            styleClass="ui-card-shadow cardBorderRadius"
                        >
                            {{ test.name }}
                        </p-card>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12">
        <h2 class="centerHeader">Diagnosis Pathologies</h2>
    </div>
    <div class="ui-g-3" *ngFor="let pathology of pathologies">
        <p-card
            class="centerHeader"
            [style]="{ height: '70px' }"
            styleClass="ui-card-shadow"
        >
            <div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ pathology.deseaseName }}
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-3">
        <div style="border-style: dotted;">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '65px' }"
                (click)="showTestDialog()"
            >
                <h3>
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px;"
                    ></i>
                    Add Pathology
                </h3>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
