<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid" *ngIf="hideDiscard">
    <div class="ui-g-12 ui-md-3" *ngIf="showAllButtons">
        <button
            type="button"
            pButton
            class="ui-button-info ui-button-raised font"
            label="Refer Patient"
            icon="fa fa-user-plus"
            (click)="showReferPatientDialog()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-3" *ngIf="showAllButtons">
        <button
            type="button"
            pButton
            class="font"
            label="Add Diagnosis"
            icon="fa fa-2x fa-stethoscope"
            (click)="addDiagnosis()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-3" *ngIf="showAllButtons">
        <button
            type="button"
            pButton
            class="font"
            label="Add Treatment"
            icon="fa fa-2x fa-medkit"
            (click)="addTreatment()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-3" *ngIf="showAllButtons">
        <button
            type="button"
            pButton
            class="font"
            label="Add Follow Up"
            icon="fa fa-2x fa-ambulance"
            (click)="addFollowup()"
        ></button>
    </div>
</div>
<p-fieldset legend="Personal Information">
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-3">
            <label for="fileID">Patient Number</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-id-card"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="fileID"
                    placeholder="Patient Number"
                    [(ngModel)]="patient.patientNumber"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <label for="first">First Name</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="first"
                    placeholder="First Name"
                    [(ngModel)]="patient.firstName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <label for="middle">Middle Name</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="middle"
                    placeholder="Middle Name"
                    [(ngModel)]="patient.middleName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <label for="last">Last Name</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="last"
                    placeholder="Last Name"
                    [(ngModel)]="patient.lastName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="email">Email</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-envelope"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="email"
                    placeholder="Email"
                    [(ngModel)]="patient.email"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="phone">Mobile</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-phone"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="phone"
                    pKeyFilter="int"
                    placeholder="Mobile"
                    [(ngModel)]="patient.mobile"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="date">Date Of Birth</label>
            <div class="labelMarginTop">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Date Of Birth"
                    [showIcon]="true"
                    id="date"
                    [(ngModel)]="patient.dateOfBirth"
                    [monthNavigator]="true"
                    [yearNavigator]="true"
                    yearRange="1950:2020"
                    showButtonBar="true"
                ></p-calendar>
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="gender">Gender</label>
            <div class="labelMarginTop">
                <p-dropdown
                    [options]="gender"
                    placeholder="Select Gender"
                    optionLabel="name"
                    id="gender"
                    [showClear]="true"
                    [(ngModel)]="genderType"
                ></p-dropdown>
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="country">Country</label>
            <div class="labelMarginTop">
                <p-autoComplete
                    [(ngModel)]="selectedCountry"
                    [suggestions]="filteredCountries"
                    (completeMethod)="filterCountry($event)"
                    field="name"
                    id="country"
                    placeholder="Country"
                    [size]="30"
                    [minLength]="1"
                ></p-autoComplete>
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="city">City</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-building"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="city"
                    placeholder="City"
                    [(ngModel)]="patient.city"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-10">
            <label for="address">Address</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-map-marker"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="address"
                    placeholder="Address"
                    [(ngModel)]="patient.address"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-2" *ngIf="showTeams">
            <label for="team">Teams</label>
            <div class="labelMarginTop">
                <p-dropdown
                    [options]="teams"
                    placeholder="Select Team"
                    optionLabel="name"
                    id="team"
                    [showClear]="true"
                    [(ngModel)]="selectedTeam"
                ></p-dropdown>
            </div>
        </div>
    </div>
</p-fieldset>
<p-fieldset legend="Medical Information">
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-4">
            <label for="blood">Blood Type</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-user-md"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="blood"
                    placeholder="Blood Type"
                    [(ngModel)]="patient.bloodType"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="contact">Emergency Contact</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-phone"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="contact"
                    placeholder="Emergency Contact"
                    [(ngModel)]="patient.emergencyContact"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="ePhone">Emergency Phone</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-phone"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="ePhone"
                    pKeyFilter="int"
                    placeholder="Emergency Phone"
                    [(ngModel)]="patient.emergencyPhone"
                />
            </div>
        </div>
    </div>
</p-fieldset>
<div class="ui-g ui-fluid" *ngIf="showAllButtons">
    <div class="ui-g-12 ui-md-8"></div>
    <div class="ui-g-12 ui-md-2" *ngIf="!hideDiscard">
        <button
            pButton
            type="button"
            label="Discard"
            (click)="discard()"
            style="margin-bottom: 10px"
            class="ui-button-danger ui-button-raised"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2" *ngIf="hideDiscard"></div>
    <div class="ui-g-12 ui-md-2">
        <button
            pButton
            type="button"
            label="Save"
            (click)="save()"
            style="margin-bottom: 10px"
            class="ui-button-icon-primary ui-button-raised"
        ></button>
    </div>
</div>
<p-dialog
    header="Refer Patient"
    [(visible)]="displayBasic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="resetReferralPatient()"
>
    <div style="height: 150px">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-8">
                <div class="ui-inputgroup">
                    <p-dropdown
                        [options]="allTeams"
                        placeholder="Select Team"
                        optionLabel="name"
                        id="team"
                        [showClear]="true"
                        [(ngModel)]="referralPatient.teamId"
                        (onChange)="onSelectTeam($event)"
                    ></p-dropdown>
                </div>
            </div>
            <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Team Department"
                        [(ngModel)]="department"
                        readonly
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-12">
                <div class="ui-inputgroup">
                    <textarea
                        [rows]="5"
                        [cols]="30"
                        pInputTextarea
                        autoResize="autoResize"
                        placeholder="Message"
                        [(ngModel)]="referralPatient.referralMessage"
                    ></textarea>
                </div>
            </div>
        </div>
    </div>
    <p-footer *ngIf="showAllButtons">
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="resetReferralPatient()"
            label="Cancel"
            class="ui-button-danger"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="referPatient()"
            label="Ok"
            class="ui-button-primary"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner></ngx-spinner>
