<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-fieldset legend="Personal Information">
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-3">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-id-card"></i
                ></span>
                <input
                    type="text"
                    pKeyFilter="alphanum"
                    pInputText
                    placeholder="File Id"
                    [(ngModel)]="patient.fileId"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pKeyFilter="alphanum"
                    pInputText
                    placeholder="First Name"
                    [(ngModel)]="patient.firstName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pKeyFilter="alphanum"
                    pInputText
                    placeholder="Middle Name"
                    [(ngModel)]="patient.middleName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pKeyFilter="alphanum"
                    pInputText
                    placeholder="Last Name"
                    [(ngModel)]="patient.lastName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-envelope"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    placeholder="Email"
                    [(ngModel)]="patient.email"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-phone"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Phone"
                    [(ngModel)]="patient.phone"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <p-calendar
                [readonlyInput]="true"
                placeholder="Date Of Birth"
                [showIcon]="true"
                [(ngModel)]="patient.dateOfBirth"
            ></p-calendar>
        </div>
        <div class="ui-g-12 ui-md-4">
            <p-dropdown
                [options]="gender"
                placeholder="Select Gender"
                optionLabel="name"
                [showClear]="true"
                [(ngModel)]="patient.gender"
            ></p-dropdown>
        </div>
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-globe"></i
                ></span>
                <input
                    type="text"
                    pKeyFilter="alphanum"
                    pInputText
                    placeholder="Country"
                    [(ngModel)]="patient.country"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-building"></i
                ></span>
                <input
                    type="text"
                    pKeyFilter="alphanum"
                    pInputText
                    placeholder="City"
                    [(ngModel)]="patient.city"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-12">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-map-marker"></i
                ></span>
                <input
                    type="text"
                    pKeyFilter="alphanum"
                    pInputText
                    placeholder="Address"
                    [(ngModel)]="patient.address"
                />
            </div>
        </div>
    </div>
</p-fieldset>
<p-fieldset legend="Medical Information">
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-user-md"></i
                ></span>
                <input
                    type="text"
                    pKeyFilter="alphanum"
                    pInputText
                    placeholder="Blood Type"
                    [(ngModel)]="patient.bloodType"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-phone"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Emergency Contact"
                    [(ngModel)]="patient.emergencyContact"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="fa fa-phone"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Emergency Phone"
                    [(ngModel)]="patient.emergencyPhone"
                />
            </div>
        </div>
    </div>
</p-fieldset>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-8"></div>
    <div class="ui-g-12 ui-md-2">
        <button
            pButton
            type="button"
            label="Discard"
            (click)="reset()"
            style="margin-bottom: 10px;"
            class="ui-button-danger ui-button-raised"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2">
        <button
            pButton
            type="button"
            label="Save"
            (click)="save()"
            style="margin-bottom: 10px;"
            class="ui-button-icon-primary ui-button-raised"
        ></button>
    </div>
</div>
<ngx-spinner></ngx-spinner>
