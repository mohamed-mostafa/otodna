<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<p-dialog
    header="Add Allergy"
    [(visible)]="displayBasic"
    [style]="{ width: '58vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <p-card [style]="{ height: '300px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-4">
                <p-dropdown
                    [options]="allergyTypes"
                    placeholder="Select Allergy Type"
                    optionLabel="name"
                    [showClear]="true"
                    [(ngModel)]="type"
                ></p-dropdown>
            </div>
            <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Substance"
                        [(ngModel)]="allergy.substance"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Reaction"
                        [(ngModel)]="allergy.reaction"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-3">
                <p-dropdown
                    [options]="allergySeverities"
                    placeholder="Select Severity"
                    optionLabel="name"
                    [showClear]="true"
                    [(ngModel)]="severity"
                ></p-dropdown>
            </div>
            <div class="ui-g-12 ui-md-3">
                <p-dropdown
                    [options]="allergyStatuses"
                    placeholder="Select Status"
                    optionLabel="name"
                    [showClear]="true"
                    [(ngModel)]="status"
                ></p-dropdown>
            </div>
            <div class="ui-g-12 ui-md-6">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Noted Date"
                    [showIcon]="true"
                    [(ngModel)]="allergy.notedDate"
                    showButtonBar="true"
                ></p-calendar>
            </div>
            <div class="ui-g-12 ui-md-12">
                <textarea
                    [rows]="5"
                    [cols]="30"
                    pInputTextarea
                    autoResize="autoResize"
                    placeholder="Comments"
                    [(ngModel)]="allergy.comment"
                ></textarea>
            </div>
        </div>
    </p-card>
    <p-footer>
        <ng-container *ngIf="showSaveButton; else elseTemplate">
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="save()"
                label="Save"
            ></button
        ></ng-container>
        <ng-template #elseTemplate>
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="update()"
                label="Update"
            ></button
        ></ng-template>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Patient Allergies</h2></div>
    <div class="ui-g-3" *ngFor="let allergy of allergies">
        <p-card
            class="centerHeader"
            [style]="{ height: '120px' }"
            styleClass="ui-card-shadow"
        >
            <p-header>
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteAllergy(allergy)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-header>
            <div (click)="viewData(allergy)" class="pointerCursor">
                <div class="ui-g-12 ui-md-12 bold">
                    {{ allergy.typeName }}
                </div>
                <div class="ui-g-12 ui-md-8 bold">
                    {{ allergy.severityName }}
                </div>
                <div class="ui-g-12 ui-md-4 bold">
                    {{ allergy.statusName }}
                </div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ allergy.notedDate | date }}
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-3">
        <div style="border-style: dotted;">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '115px' }"
                (click)="showDialog()"
            >
                <h3 style="margin-top: 30px;">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px;"
                    ></i>
                    Add Allergy
                </h3>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
