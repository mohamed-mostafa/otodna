<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid" *ngIf="!showButtons && session.ended === 'false'">
    <div class="ui-g-12 ui-md-10"></div>
    <div class="ui-g-12 ui-md-2">
        <button
            pButton
            type="button"
            label="End Session"
            (click)="endSession()"
            class="ui-button-danger ui-button-raised"
        ></button>
    </div>
</div>
<p-fieldset legend="Patient Session">
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-4">
            <label for="displayName">Display Name</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="displayName"
                    placeholder="Display Name"
                    [(ngModel)]="session.displayName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="date">Date</label>
            <div class="labelMarginTop">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Date"
                    [showIcon]="true"
                    id="date"
                    [(ngModel)]="session.date"
                    [monthNavigator]="true"
                    [yearNavigator]="true"
                    yearRange="1950:2020"
                    showButtonBar="true"
                ></p-calendar>
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <label for="performer">Performer</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="performer"
                    placeholder="Performer"
                    [(ngModel)]="session.performer"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-12">
            <label for="notes">Conclusion</label>
            <div class="labelMarginTop">
                <textarea
                    [rows]="5"
                    [cols]="30"
                    id="notes"
                    pInputTextarea
                    autoResize="autoResize"
                    placeholder="Conclusion"
                    [(ngModel)]="session.notes"
                ></textarea>
            </div>
        </div>
    </div>
</p-fieldset>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-8"></div>
    <ng-container *ngIf="showButtons; else elseTemplate">
        <div class="ui-g-12 ui-md-2">
            <button
                pButton
                type="button"
                label="Discard"
                (click)="reset()"
                style="margin-bottom: 10px;"
                class="ui-button-danger ui-button-raised"
            ></button>
        </div>
        <div class="ui-g-12 ui-md-2">
            <button
                pButton
                type="button"
                label="Start Session"
                (click)="save()"
                style="margin-bottom: 10px;"
                class="ui-button-icon-primary ui-button-raised"
            ></button>
        </div>
    </ng-container>
    <ng-template #elseTemplate>
        <div class="ui-g-12 ui-md-2">
            <button
                pButton
                type="button"
                label="Back"
                (click)="reset()"
                style="margin-bottom: 10px;"
                class="ui-button-danger ui-button-raised"
            ></button>
        </div>
        <div class="ui-g-12 ui-md-2">
            <button
                pButton
                type="button"
                label="Update"
                (click)="update()"
                style="margin-bottom: 10px;"
                class="ui-button-icon-primary ui-button-raised"
            ></button>
        </div>
    </ng-template>
</div>
<ngx-spinner></ngx-spinner>
