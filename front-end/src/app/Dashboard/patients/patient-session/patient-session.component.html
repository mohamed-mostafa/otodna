<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<app-patient-summary></app-patient-summary>
<p-fieldset legend="Patient Session">
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-3">
            <label for="displayName">Display Name</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="displayName"
                    placeholder="Display Name"
                    [(ngModel)]="session.displayName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <label for="date">Date</label>
            <div class="labelMarginTop">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Date"
                    [showIcon]="true"
                    id="date"
                    [(ngModel)]="session.date"
                    [monthNavigator]="true"
                    [yearNavigator]="true"
                    yearRange="1950:2020"
                    showButtonBar="true"
                ></p-calendar>
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <label for="performer">Performer</label>
            <div class="ui-inputgroup labelMarginTop">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    id="performer"
                    placeholder="Performer"
                    [(ngModel)]="session.performer"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <label for="team">Departments</label>
            <div class="labelMarginTop">
                <p-dropdown
                    [options]="departments"
                    placeholder="Select Department"
                    optionLabel="name"
                    id="department"
                    [showClear]="true"
                    [(ngModel)]="selectedDepartment"
                ></p-dropdown>
            </div>
        </div>
        <div class="ui-g-12 ui-md-12 removePaddingAndMargin">
            <label class="ui-g-12 ui-md-12" for="notes">Conclusion</label>
        </div>
        <div class="ui-g-12 ui-md-12 removePaddingAndMargin">
            <div class="layout-dashboard">
                <div class="chat">
                    <div class="new-message">
                        <textarea
                            [rows]="5"
                            [cols]="30"
                            id="notes"
                            pInputTextarea
                            class="backgroundColor"
                            autoResize="autoResize"
                            placeholder="Conclusion"
                            [(ngModel)]="session.notes"
                        ></textarea>
                        <div
                            class="new-message-footer"
                            *ngIf="
                                session.ended === 'false' &&
                                showAllButtons &&
                                showGenerateConclusion
                            "
                        >
                            <a
                                class="new-message-send floatLeft"
                                (click)="generateConclusion()"
                                ><span class="fa fa-refresh"></span> Generate</a
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</p-fieldset>
<div class="ui-g ui-fluid" *ngIf="showAllButtons">
    <div class="ui-g-12 ui-md-8"></div>
    <ng-container *ngIf="showButtons; else elseTemplate">
        <div class="ui-g-12 ui-md-2">
            <button
                pButton
                type="button"
                label="Discard"
                (click)="reset()"
                style="margin-bottom: 10px"
                class="ui-button-danger ui-button-raised"
            ></button>
        </div>
        <div class="ui-g-12 ui-md-2">
            <button
                pButton
                type="button"
                label="Start Session"
                (click)="save()"
                style="margin-bottom: 10px"
                class="ui-button-icon-primary ui-button-raised"
            ></button>
        </div>
    </ng-container>
    <ng-template #elseTemplate>
        <div class="ui-g-12 ui-md-2">
            <button
                pButton
                type="button"
                label="Back"
                (click)="reset()"
                style="margin-bottom: 10px"
                class="ui-button-danger ui-button-raised"
            ></button>
        </div>
        <div class="ui-g-12 ui-md-2">
            <button
                pButton
                type="button"
                label="Update"
                (click)="update()"
                style="margin-bottom: 10px"
                class="ui-button-icon-primary ui-button-raised"
            ></button>
        </div>
    </ng-template>
</div>
<ngx-spinner></ngx-spinner>
