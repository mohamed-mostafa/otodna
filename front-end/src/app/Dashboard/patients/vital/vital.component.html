<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid" *ngIf="showTableFlag">
    <div class="ui-g-12 ui-md-9"></div>
    <div class="ui-g-12 ui-md-3">
        <button
            type="button"
            (click)="showDialog()"
            pButton
            icon="pi pi-external-link"
            label="Add Vital"
        ></button>
    </div>
</div>
<div class="centerClass" *ngIf="!showTableFlag">
    <h3>Click Add Vital To Add A New Vital</h3>
    <button
        type="button"
        (click)="showDialog()"
        pButton
        icon="pi pi-external-link"
        label="Add Vital"
    ></button>
</div>
<p-dialog
    header="Add Vital"
    [(visible)]="displayBasic"
    [style]="{ width: '60vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
>
    <p-card [style]="{ height: '300px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <input
                        type="number"
                        pInputText
                        pKeyFilter="int"
                        placeholder="Record type"
                        [(ngModel)]="vital.vitalRecordTypeId"
                    />
                </div>
                <!-- <p-dropdown
                    [options]="recordType"
                    placeholder="Select Record Type"
                    optionLabel="name"
                    [showClear]="true"
                    [(ngModel)]="vital.vitalRecordTypeId"
                ></p-dropdown> -->
            </div>
            <div class="ui-g-12 ui-md-3">
                <div class="ui-inputgroup">
                    <input
                        type="number"
                        pInputText
                        pKeyFilter="int"
                        placeholder="Record Value"
                        [(ngModel)]="vital.vitalRecordValue"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-5">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Noted Date"
                    [showIcon]="true"
                    [(ngModel)]="vital.notedDate"
                    showButtonBar="true"
                ></p-calendar>
            </div>
            <div class="ui-g-12 ui-md-12">
                <textarea
                    [rows]="5"
                    [cols]="30"
                    pInputTextarea
                    autoResize="autoResize"
                    placeholder="Comment"
                    [(ngModel)]="vital.comment"
                ></textarea>
            </div>
        </div>
    </p-card>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancel()"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="save()"
            label="Save"
        ></button>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid" *ngIf="showTableFlag">
    <div class="ui-g-12">
        <div class="card card-w-title">
            <p-table
                #dt
                [columns]="cols"
                styleClass="ui-table-cars"
                [value]="vitals"
                [paginator]="true"
                [resizableColumns]="true"
                [responsive]="true"
                [rows]="10"
                dataKey="vin"
                selectionMode="single"
            >
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            [pSortableColumn]="col.field"
                            [ngSwitch]="col.field"
                            [ngStyle]="{ width: col.width }"
                        >
                            {{ col.header }}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Record Type </span
                            >{{ rowData.vitalRecordTypeId }}
                        </td>
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Record Value </span
                            >{{ rowData.vitalRecordValue }}
                        </td>
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Noted Date </span
                            >{{ rowData.notedDate | date }}
                        </td>
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Comment </span
                            >{{ rowData.comment }}
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
