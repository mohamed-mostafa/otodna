<app-patient-breadcrumb
    [firstName]="selectedPatient.firstName"
    [lastName]="selectedPatient.lastName"
></app-patient-breadcrumb>
<app-patient-summary></app-patient-summary>
<p-dialog
    header="Vital"
    [(visible)]="displayBasic"
    [style]="{ width: '58vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <p-card [style]="{ height: '300px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-4">
                <p-dropdown
                    [options]="recordTypes"
                    placeholder="Select Record Type"
                    optionLabel="name"
                    [showClear]="true"
                    [(ngModel)]="recordType"
                ></p-dropdown>
            </div>
            <div class="ui-g-12 ui-md-3">
                <div class="ui-inputgroup">
                    <input
                        type="number"
                        pInputText
                        pKeyFilter="int"
                        placeholder="Record Value"
                        [(ngModel)]="vital.vitalRecordValue"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-5">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Noted Date"
                    [showIcon]="true"
                    [(ngModel)]="vital.notedDate"
                    showButtonBar="true"
                ></p-calendar>
            </div>
            <div class="ui-g-12 ui-md-12">
                <textarea
                    [rows]="5"
                    [cols]="30"
                    pInputTextarea
                    autoResize="autoResize"
                    placeholder="Comment"
                    [(ngModel)]="vital.comment"
                ></textarea>
            </div>
        </div>
    </p-card>
    <p-footer *ngIf="showAllButtons">
        <ng-container *ngIf="showSaveButton; else elseTemplate">
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="save()"
                label="Save"
            ></button
        ></ng-container>
        <ng-template #elseTemplate>
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="update()"
                label="Update"
            ></button
        ></ng-template>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-3" *ngFor="let vital of vitals">
        <p-card
            class="centerHeader"
            [style]="{ height: '130px' }"
            styleClass="ui-card-shadow"
        >
            <div (click)="viewData(vital)" class="pointerCursor">
                <div class="ui-g-12 ui-md-12 bold">
                    {{ vital.vitalName }}
                </div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ vital.vitalRecordValue }} {{ vital.vitalUnit }}
                </div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ vital.notedDate | date }}
                </div>
            </div>
            <p-footer *ngIf="showAllButtons">
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteVital(vital)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-footer>
        </p-card>
    </div>
    <div class="ui-g-3" *ngIf="showAllButtons">
        <div style="border-style: dotted">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '125px' }"
                (click)="showDialog()"
            >
                <h3 style="margin-top: 35px">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px"
                    ></i>
                    Add Vital
                </h3>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner type="ball-fussion" color="#61b5a1"></ngx-spinner>
