<app-patient-breadcrumb
    [firstName]="selectedPatient.firstName"
    [lastName]="selectedPatient.lastName"
></app-patient-breadcrumb>
<app-patient-summary></app-patient-summary>
<ng-container *ngIf="displayTest; else elseDisplayTreatmentTest">
    <div class="cardMargin">
        <p-card>
            <p-header>
                <p-breadcrumb
                    [model]="treatmentBreadCrumb"
                    [home]="home"
                ></p-breadcrumb>
            </p-header>
            <div>
                <div class="ui-g ui-fluid">
                    <div class="ui-g-12 ui-md-10" *ngIf="showTests">
                        <div class="ui-g-12 ui-md-12">
                            <ng-container
                                *ngIf="
                                    showTreatmentLoading;
                                    else notShowTreatmentLoading
                                "
                            >
                                <p-progressSpinner
                                    strokeWidth="8"
                                    fill="#EEEEEE"
                                    animationDuration=".5s"
                                ></p-progressSpinner>
                            </ng-container>
                            <ng-template #notShowTreatmentLoading>
                                <app-search-result-item
                                    [allTests]="allTreatments"
                                    (testEvent)="receiveTest($event)"
                                    displayName="treatmentName"
                                ></app-search-result-item>
                            </ng-template>
                        </div>
                    </div>
                    <div
                        class="ui-g-12 ui-md-2 frequentlyUsedDiv"
                        *ngIf="showTests"
                    >
                        <span class="frequentlyUsed"> Frequently Used </span>
                        <app-frequently-used
                            [type]="'treatment'"
                            (frequentlyUsedEvent)="selectFrequentlyUsed($event)"
                        ></app-frequently-used>
                    </div>
                    <div class="ui-g-12 ui-md-12" *ngIf="!showTests">
                        <app-clinical-history-parameters
                            [showDialogLeftData]="showDialogLeftData"
                            [parameters]="parameters"
                            [showDialogRightData]="showDialogRightData"
                            class="width100"
                        ></app-clinical-history-parameters>
                    </div>
                </div>
            </div>
            <p-footer>
                <div class="ui-g ui-fluid footer">
                    <div class="ui-g-12 ui-md-8" *ngIf="showTests"></div>
                    <div class="ui-g-12 ui-md-2" *ngIf="showTests">
                        <button
                            type="button"
                            pButton
                            icon="pi pi-times"
                            (click)="showTreatments()"
                            label="Cancel"
                            *ngIf="showAllButtons"
                            class="ui-button-secondary"
                        ></button>
                    </div>
                    <div class="ui-g-12 ui-md-2" *ngIf="showTests"></div>
                    <div class="ui-g-12 ui-md-8" *ngIf="!showTests"></div>
                    <div
                        class="ui-g-12 ui-md-4"
                        *ngIf="!showTests && showSaveButton"
                    >
                        <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                            <button
                                type="button"
                                pButton
                                icon="pi pi-times"
                                (click)="showSearchTreatment()"
                                label="Back"
                                class="ui-button-secondary"
                            ></button>
                        </div>
                        <div class="ui-g-12 ui-md-6" *ngIf="showAllButtons">
                            <button
                                *ngIf="!showTests"
                                type="submit"
                                pButton
                                (click)="save()"
                                icon="pi pi-check"
                                label="Save"
                                class="ui-button-icon-primary"
                            ></button>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-md-4" *ngIf="!showSaveButton">
                        <p-footer *ngIf="showAllButtons">
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="reset()"
                                    label="Cancel"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    *ngIf="!showTests"
                                    type="submit"
                                    pButton
                                    (click)="update()"
                                    icon="pi pi-check"
                                    label="Update"
                                    class="ui-button-icon-primary"
                                ></button>
                            </div>
                        </p-footer>
                        <p-footer *ngIf="showTests">
                            <div class="ui-g-12 ui-md-6"></div>
                            <div class="ui-g-12 ui-md-6">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    (click)="showTreatments()"
                                    label="Close"
                                    class="ui-button-secondary"
                                ></button>
                            </div>
                        </p-footer>
                    </div>
                    <div
                        class="ui-g-12 ui-md-2"
                        *ngIf="!showTests || !showSaveButton"
                    ></div>
                </div>
            </p-footer>
        </p-card>
    </div>
</ng-container>
<ng-template #elseDisplayTreatmentTest>
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-6 rightVerticalLine">
            <h2 class="centerHeader removeMarginAndPadding rightColor">R</h2>
            <div
                class="ui-g-12 ui-md-12 rightFloat"
                *ngFor="let right of rightTreatments"
            >
                <div class="rightCardBorder">
                    <p-card
                        class="centerHeader pointerCursor"
                        [style]="{ height: '100px' }"
                        styleClass="ui-card-shadow"
                        [header]="right.treatmentName"
                    >
                        <div (click)="retrieveTestData(right)">
                            <div class="ui-g-12 ui-md-8 bold">
                                {{ right.rightDate | date }}
                            </div>
                            <div class="ui-g-12 ui-md-4 bold">
                                <ng-container
                                    *ngIf="
                                        right.ear === 'BOTH';
                                        else elseRightNotEqualBoth
                                    "
                                >
                                    Both ears
                                </ng-container>
                                <ng-template #elseRightNotEqualBoth>
                                    <ng-container
                                        *ngIf="
                                            right.ear === 'R';
                                            else elseRightNotEqualR
                                        "
                                    >
                                        Right ear
                                    </ng-container>
                                    <ng-template #elseRightNotEqualR>
                                        Left ear
                                    </ng-template>
                                </ng-template>
                            </div>
                        </div>
                        <p-footer *ngIf="showAllButtons">
                            <a
                                href="javascript:void(0)"
                                class="iconStyle"
                                (click)="delete(right)"
                                title="Remove"
                            >
                                <i class="fa fa-trash-o" aria-hidden="true"></i>
                            </a>
                        </p-footer>
                    </p-card>
                </div>
            </div>
            <div class="ui-g-12 ui-md-12 rightFloat" *ngIf="showAllButtons">
                <div style="border-style: dotted" class="rightCardBorder">
                    <p-card
                        class="centerHeader pointerCursor"
                        [style]="{ height: '95px' }"
                        (click)="showRightTreatmentDialog()"
                    >
                        <div class="addTestStyle">
                            <i
                                class="fa fa-plus"
                                aira-hidden="true"
                                style="margin: 5px"
                            ></i>
                            Add Treatment
                        </div>
                    </p-card>
                </div>
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <h2 class="centerHeader removeMarginAndPadding leftColor">L</h2>
            <div
                class="ui-g-12 ui-md-12 leftFloat"
                *ngFor="let left of leftTreatments"
            >
                <div class="leftCardBorder">
                    <p-card
                        class="centerHeader pointerCursor"
                        [style]="{ height: '100px' }"
                        styleClass="ui-card-shadow"
                        [header]="left.treatmentName"
                    >
                        <div (click)="retrieveTestData(left)">
                            <div class="ui-g-12 ui-md-8 bold">
                                {{ left.leftDate | date }}
                            </div>
                            <div class="ui-g-12 ui-md-4 bold">
                                <ng-container
                                    *ngIf="
                                        left.ear === 'BOTH';
                                        else elseLeftNotEqualBoth
                                    "
                                >
                                    Both ears
                                </ng-container>
                                <ng-template #elseLeftNotEqualBoth>
                                    <ng-container
                                        *ngIf="
                                            left.ear === 'R';
                                            else elseLeftNotEqualR
                                        "
                                    >
                                        Right ear
                                    </ng-container>
                                    <ng-template #elseLeftNotEqualR>
                                        Left ear
                                    </ng-template>
                                </ng-template>
                            </div>
                        </div>
                        <p-footer *ngIf="showAllButtons">
                            <a
                                href="javascript:void(0)"
                                class="iconStyle"
                                (click)="delete(left)"
                                title="Remove"
                            >
                                <i class="fa fa-trash-o" aria-hidden="true"></i>
                            </a>
                        </p-footer>
                    </p-card>
                </div>
            </div>
            <div class="ui-g-12 ui-md-12 leftFloat" *ngIf="showAllButtons">
                <div style="border-style: dotted" class="leftCardBorder">
                    <p-card
                        class="centerHeader pointerCursor"
                        [style]="{ height: '95px' }"
                        (click)="showLeftTreatmentDialog()"
                    >
                        <div class="addTestStyle">
                            <i
                                class="fa fa-plus"
                                aira-hidden="true"
                                style="margin: 5px"
                            ></i>
                            Add Treatment
                        </div>
                    </p-card>
                </div>
            </div>
        </div>
    </div>
</ng-template>
<ngx-spinner type="ball-fussion" color="#61b5a1"></ngx-spinner>
