<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-6"></div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Diagnosis"
            icon="fa fa-stethoscope"
            (click)="addDiagnosis()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Treatment"
            icon="fa fa-medkit"
            (click)="addTreatment()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Follow Up"
            icon="fa fa-ambulance"
            (click)="addFollowup()"
        ></button>
    </div>
</div>
<div class="layout-dashboard">
    <div class="ui-g">
        <div class="ui-g-12 ui-lg-12">
            <div class="card timeline ui-fluid">
                <div class="ui-g">
                    <div class="ui-g-3">
                        <br />
                        <span *ngFor="let diagnosis of allDiagnosis">
                            <div class="marginBottomAndTop">
                                {{ diagnosis.date | date }}
                            </div>
                        </span>
                        <i
                            class="fa fa-stethoscope"
                            *ngIf="allDiagnosis && allDiagnosis.length > 0"
                            style="color: #61b5a1;"
                        ></i>
                    </div>
                    <div class="ui-g-9">
                        <span
                            class="event-owner marginBottomAndTop"
                            *ngIf="allDiagnosis && allDiagnosis.length > 0"
                            >Diagnosis</span
                        >
                        <span *ngFor="let diagnosis of allDiagnosis">
                            <div
                                class="marginBottomAndTop pointerCursor"
                                (click)="openDiagnosis(diagnosis)"
                            >
                                {{ diagnosis.displayName }}
                            </div>
                        </span>
                    </div>
                    <div class="ui-g-3">
                        <br />
                        <span *ngFor="let treatment of allTreatments">
                            <div class="marginBottomAndTop">
                                {{ treatment.date | date }}
                            </div>
                        </span>
                        <i
                            *ngIf="allTreatments && allTreatments.length > 0"
                            class="fa fa-medkit"
                            style="color: #61b5a1;"
                        ></i>
                    </div>
                    <div class="ui-g-9">
                        <span
                            class="event-owner marginBottomAndTop"
                            *ngIf="allTreatments && allTreatments.length > 0"
                            >Treatment</span
                        >
                        <span *ngFor="let treatment of allTreatments">
                            <div
                                class="marginBottomAndTop pointerCursor"
                                (click)="openTreatment(treatment)"
                            >
                                {{ treatment.displayName }}
                            </div>
                        </span>
                    </div>
                    <div class="ui-g-3">
                        <br />
                        <span *ngFor="let followup of allFollowups">
                            <div class="marginBottomAndTop">
                                {{ followup.date | date }}
                            </div>
                        </span>
                        <i
                            *ngIf="allFollowups && allFollowups.length > 0"
                            class="fa fa-ambulance"
                            style="color: #61b5a1;"
                        ></i>
                    </div>
                    <div class="ui-g-9">
                        <span
                            class="event-owner marginBottomAndTop"
                            *ngIf="allFollowups && allFollowups.length > 0"
                            >Followup</span
                        >
                        <span *ngFor="let followup of allFollowups">
                            <div
                                class="marginBottomAndTop pointerCursor"
                                (click)="openFollowup(followup)"
                            >
                                {{ followup.displayName }}
                            </div>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
