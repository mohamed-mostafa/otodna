<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-6"></div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Diagnosis"
            icon="fa fa-stethoscope"
            (click)="addDiagnosis()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Treatment"
            icon="fa fa-medkit"
            (click)="addTreatment()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Follow Up"
            icon="fa fa-ambulance"
            (click)="addFollowup()"
        ></button>
    </div>
</div>
<div class="layout-dashboard">
    <div class="ui-g">
        <div class="ui-g-12 ui-lg-12">
            <div class="card timeline ui-fluid">
                <div class="ui-g" *ngFor="let data of allData">
                    <div class="ui-g-3">
                        <br />
                        <span>
                            <div class="marginBottomAndTop">
                                {{ data.date | date }}
                            </div>
                        </span>
                        <i
                            *ngIf="data.sessionTypeId === 0"
                            class="fa fa-stethoscope"
                            style="color: #61b5a1;"
                        ></i>
                        <i
                            *ngIf="data.sessionTypeId === 1"
                            class="fa fa-medkit"
                            style="color: #61b5a1;"
                        ></i>
                        <i
                            *ngIf="data.sessionTypeId === 2"
                            class="fa fa-ambulance"
                            style="color: #61b5a1;"
                        ></i>
                    </div>
                    <div class="ui-g-9">
                        <span
                            *ngIf="data.sessionTypeId === 0"
                            class="event-owner marginBottomAndTop"
                            >Diagnosis</span
                        >
                        <span
                            *ngIf="data.sessionTypeId === 1"
                            class="event-owner marginBottomAndTop"
                            >Treatment</span
                        >
                        <span
                            *ngIf="data.sessionTypeId === 2"
                            class="event-owner marginBottomAndTop"
                            >Followup</span
                        >
                        <span>
                            <div
                                class="marginBottomAndTop pointerCursor"
                                (click)="openDiagnosis(data)"
                            >
                                {{ data.displayName }}
                            </div>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
