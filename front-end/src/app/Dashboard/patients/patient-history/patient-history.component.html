<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-6"></div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Diagnosis"
            (click)="addDiagnosis()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Treatment"
            (click)="addTreatment()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2">
        <button
            type="button"
            pButton
            label="Add Follow Up"
            (click)="addFollowup()"
        ></button>
    </div>
    <div class="ui-g-12">
        <div class="card card-w-title">
            <h1>Patient History</h1>
            <p-fullCalendar
                [events]="events"
                [options]="fullcalendarOptions"
            ></p-fullCalendar>
        </div>
    </div>
</div>
