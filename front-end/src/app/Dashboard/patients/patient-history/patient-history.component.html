<app-patient-breadcrumb
    [firstName]="selectedPatient.firstName"
    [lastName]="selectedPatient.lastName"
></app-patient-breadcrumb>
<app-patient-summary></app-patient-summary>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-6"></div>
    <div class="ui-g-12 ui-md-2" *ngIf="showAllButtons">
        <button
            type="button"
            pButton
            label="Add Diagnosis"
            icon="fa fa-stethoscope"
            (click)="addDiagnosis()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2" *ngIf="showAllButtons">
        <button
            type="button"
            pButton
            label="Add Treatment"
            icon="fa fa-medkit"
            (click)="addTreatment()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2" *ngIf="showAllButtons">
        <button
            type="button"
            pButton
            label="Add Follow Up"
            icon="fa fa-ambulance"
            (click)="addFollowup()"
        ></button>
    </div>
</div>
<div class="layout-dashboard">
    <div class="ui-g">
        <div class="ui-g-12 ui-lg-12">
            <div class="card timeline ui-fluid">
                <div class="ui-g" *ngFor="let data of allData">
                    <div class="ui-g-3">
                        <br />
                        <span>
                            <div
                                class="marginBottomAndTop pointerCursor rightFloated rightMargin"
                                (click)="openDataPage(data)"
                            >
                                {{ data.date | date }}
                            </div>
                        </span>
                        <i
                            *ngIf="data.sessionTypeId === 0"
                            class="fa fa-stethoscope marginBottomAndTop pointerCursor"
                            (click)="openDataPage(data)"
                            style="color: #61b5a1"
                        ></i>
                        <i
                            *ngIf="data.sessionTypeId === 1"
                            class="fa fa-medkit marginBottomAndTop pointerCursor"
                            (click)="openDataPage(data)"
                            style="color: #61b5a1"
                        ></i>
                        <i
                            *ngIf="data.sessionTypeId === 2"
                            class="fa fa-ambulance marginBottomAndTop pointerCursor"
                            (click)="openDataPage(data)"
                            style="color: #61b5a1"
                        ></i>
                    </div>
                    <div class="ui-g-9">
                        <span
                            *ngIf="data.sessionTypeId === 0"
                            class="event-owner marginBottomAndTop pointerCursor"
                            (click)="openDataPage(data)"
                            >Diagnosis</span
                        >
                        <span
                            *ngIf="data.sessionTypeId === 1"
                            class="event-owner marginBottomAndTop pointerCursor"
                            (click)="openDataPage(data)"
                            >Treatment</span
                        >
                        <span
                            *ngIf="data.sessionTypeId === 2"
                            class="event-owner marginBottomAndTop pointerCursor"
                            (click)="openDataPage(data)"
                            >Followup</span
                        >
                        <span>
                            <div
                                class="marginBottomAndTop pointerCursor preLineWhiteSpace"
                                (click)="openDataPage(data)"
                            >
                                {{
                                    data.notes
                                        ? data.notes
                                        : "Session is not ended, Please end session"
                                }}
                            </div>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
