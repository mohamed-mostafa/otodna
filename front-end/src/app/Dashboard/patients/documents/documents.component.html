<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<p-toast></p-toast>
<div class="ui-g">
    <div class="ui-g-12">
        <div class="card">
            <h1>Upload Documents</h1>
            <p-fileUpload
                multiple="multiple"
                maxFileSize="100000000"
                customUpload="true"
                name="file"
                ngDefaultControl
                [(ngModel)]="file"
                (uploadHandler)="uploadFiles($event)"
            >
            </p-fileUpload>
        </div>
    </div>
</div>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Patient Documents</h2></div>
    <div class="ui-g-3" *ngFor="let document of allDocuments">
        <p-card
            class="centerHeader"
            [style]="{ height: '90px' }"
            styleClass="ui-card-shadow"
        >
            <p-header>
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteDocument(document)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-header>
            <div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ removeKey(document.Key) }}
                </div>
            </div>
        </p-card>
    </div>
</div>
<ngx-spinner></ngx-spinner>
