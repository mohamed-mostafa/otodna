<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-toast></p-toast>
<div class="ui-g">
    <div class="ui-g-12">
        <div class="card">
            <h1>Upload Documents</h1>
            <p-fileUpload
                multiple="multiple"
                maxFileSize="100000000"
                customUpload="true"
                name="file"
                ngDefaultControl
                [(ngModel)]="file"
                (uploadHandler)="uploadFiles($event)"
            >
            </p-fileUpload>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
