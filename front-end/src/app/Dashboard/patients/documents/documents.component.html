<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<p-toast></p-toast>
<div class="ui-g">
    <div class="ui-g-12">
        <div class="card">
            <h1>Upload Documents</h1>
            <p-fileUpload
                multiple="multiple"
                maxFileSize="100000000"
                customUpload="true"
                name="file"
                ngDefaultControl
                [(ngModel)]="file"
                (uploadHandler)="uploadFiles($event)"
            >
            </p-fileUpload>
        </div>
    </div>
</div>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Patient Documents</h2></div>
    <div class="ui-g-3" *ngFor="let document of allDocuments">
        <p-card
            class="centerHeader"
            [style]="{ height: '120px' }"
            styleClass="ui-card-shadow"
        >
            <p-header>
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteDocument(document)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-header>
            <div (click)="viewDocument(document)" class="pointerCursor">
                <div class="ui-g-12 ui-md-12 bold">
                    <div class="ui-g-12 ui-md-2">
                        <ng-container
                            *ngIf="
                                document.Key.includes('.PDF'.toLowerCase());
                                else elseTemplate
                            "
                        >
                            <i class="fa fa-2x fa-file-pdf-o"></i>
                        </ng-container>
                        <ng-template #elseTemplate>
                            <ng-container
                                *ngIf="
                                    document.Key.includes(
                                        '.PNG'.toLowerCase()
                                    ) ||
                                        document.Key.includes(
                                            '.JPG'.toLowerCase()
                                        ) ||
                                        document.Key.includes(
                                            '.JPEG'.toLowerCase()
                                        );
                                    else elseTemplate2
                                "
                            >
                                <i class="fa fa-2x fa-file-image-o"></i>
                            </ng-container>
                            <ng-template #elseTemplate2>
                                <ng-container
                                    *ngIf="
                                        document.Key.includes(
                                            '.DOCX'.toLowerCase()
                                        );
                                        else elseTemplate3
                                    "
                                >
                                    <i class="fa fa-2x fa-file-word-o"></i>
                                </ng-container>
                                <ng-template #elseTemplate3>
                                    <ng-container
                                        *ngIf="
                                            document.Key.includes(
                                                '.CSV'.toLowerCase()
                                            );
                                            else elseTemplate4
                                        "
                                    >
                                        <i class="fa fa-2x fa-file-excel-o"></i>
                                    </ng-container>
                                    <ng-template #elseTemplate4>
                                        <i class="fa fa-2x fa-file"></i
                                    ></ng-template>
                                </ng-template>
                            </ng-template>
                        </ng-template>
                    </div>
                    <div class="ui-g-12 ui-md-10">
                        {{ removeKey(document.Key) }}
                        <br />
                        {{ document.Size }} Bytes
                    </div>
                </div>
            </div>
        </p-card>
    </div>
</div>
<ngx-spinner></ngx-spinner>
