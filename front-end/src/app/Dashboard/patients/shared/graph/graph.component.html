<div class="ui-g-12 ui-md-6 rightVerticalLine">
    <div *ngIf="showDialogRightData">
        <p-toast [style]="{ marginTop: '80px' }"></p-toast>
        <p-chart
            type="line"
            [data]="rightGraphData"
            [options]="options"
            (onDataSelect)="selectRightData($event)"
        ></p-chart>
    </div>
</div>
<div class="ui-g-12 ui-md-6">
    <div *ngIf="showDialogLeftData">
        <p-toast [style]="{ marginTop: '80px' }"></p-toast>
        <p-chart
            type="line"
            [data]="leftGraphData"
            [options]="options"
            (onDataSelect)="selectLeftData($event)"
        ></p-chart>
    </div>
</div>
