<ng-container *ngIf="type === 'right'; else elseTemplate">
    <input
        type="text"
        pInputText
        id="right-{{ value.name }}"
        [placeholder]="value.name"
        [required]="value.required"
        [(ngModel)]="value.rightVal"
        [readonly]="readonly"
    />
</ng-container>
<ng-template #elseTemplate>
    <input
        type="text"
        pInputText
        id="left-{{ value.name }}"
        [placeholder]="value.name"
        [required]="value.required"
        [(ngModel)]="value.leftVal"
        [readonly]="readonly"
    />
</ng-template>
