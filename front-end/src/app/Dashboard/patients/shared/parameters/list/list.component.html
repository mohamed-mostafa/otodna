<ng-container *ngIf="type === 'right'; else elseTemplate">
    <div class="ui-g-12 ui-md-11 minusMargin">
        <label for="right-{{ value.name }}">
            {{ value.displayName ? value.displayName : value.name }}</label
        >
        <div class="ui-inputgroup labelMarginTop">
            <span class="ui-inputgroup-addon rightBackgroundColor">R</span>
            <ng-container *ngIf="!readonly; else elseNotRightReadonly">
                <p-dropdown
                    [options]="value.values"
                    placeholder="Select Value"
                    optionLabel="name"
                    id="right-{{ value.name }}"
                    [showClear]="true"
                    [(ngModel)]="value.rightVal"
                    (onChange)="checkRightListItem(value)"
                ></p-dropdown>
            </ng-container>
            <ng-template #elseNotRightReadonly>
                <input
                    type="text"
                    pInputText
                    id="right-{{ value.name }}"
                    [placeholder]="value.name"
                    [(ngModel)]="value.rightVal.name"
                    [readonly]="readonly"
                />
            </ng-template>
        </div>
    </div>
    <div class="ui-g-12 ui-md-12" *ngFor="let param of rightListParameters">
        <div *ngIf="param.showRight">
            <app-list
                [value]="param"
                [readonly]="readonly"
                [parameters]="parameters"
                type="right"
            ></app-list>
        </div>
    </div>
</ng-container>
<ng-template #elseTemplate>
    <div class="ui-g-12 ui-md-11 minusMargin">
        <label for="left-{{ value.name }}">
            {{ value.displayName ? value.displayName : value.name }}</label
        >
        <div class="ui-inputgroup labelMarginTop">
            <span class="ui-inputgroup-addon leftBackgroundColor">L</span>
            <ng-container *ngIf="!readonly; else elseNotLeftReadonly">
                <p-dropdown
                    [options]="value.values"
                    placeholder="Select Value"
                    optionLabel="name"
                    id="left-{{ value.name }}"
                    [showClear]="true"
                    [(ngModel)]="value.leftVal"
                    [readonly]="readonly"
                    (onChange)="checkLeftListItem(value)"
                ></p-dropdown>
            </ng-container>
            <ng-template #elseNotLeftReadonly>
                <input
                    type="text"
                    pInputText
                    id="left-{{ value.name }}"
                    [placeholder]="value.name"
                    [(ngModel)]="value.leftVal.name"
                    [readonly]="readonly"
                />
            </ng-template>
        </div>
    </div>
    <div class="ui-g-12 ui-md-12" *ngFor="let param of leftListParameters">
        <div *ngIf="param.showLeft">
            <app-list
                [value]="param"
                [readonly]="readonly"
                [parameters]="parameters"
                type="left"
            ></app-list>
        </div>
    </div>
</ng-template>
