<ng-container *ngIf="type === 'right'; else elseTemplate">
    <p-checkbox
        label=" {{ value.name }}"
        [value]="value.name"
        [required]="value.required"
        [(ngModel)]="value.rightVal"
        [readonly]="readonly"
    ></p-checkbox>
</ng-container>
<ng-template #elseTemplate>
    <p-checkbox
        label="{{ value.name }}"
        [value]="value.name"
        [required]="value.required"
        [(ngModel)]="value.leftVal"
        [readonly]="readonly"
    ></p-checkbox>
</ng-template>
