<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-6 rightVerticalLine">
        <h2 class="centerHeader removeMarginAndPadding rightColor">R</h2>
    </div>
    <div class="ui-g-12 ui-md-6">
        <h2 class="centerHeader removeMarginAndPadding leftColor">L</h2>
    </div>
    <div
        *ngFor="let t of parameters"
        class="ui-g-12 ui-md-12 removeMarginAndPadding"
    >
        <div
            class="ui-g-12 ui-md-12 removeMarginAndPadding"
            *ngIf="t.type === 'text'"
        >
            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                <label for="right-{{ t.name }}">{{ t.name }}</label>
                <div class="ui-inputgroup labelMarginTop">
                    <span class="ui-inputgroup-addon rightBackgroundColor"
                        >R</span
                    >
                    <input
                        type="text"
                        pInputText
                        id="right-{{ t.name }}"
                        [placeholder]="t.name"
                        [required]="t.required"
                        [(ngModel)]="t.rightVal"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="left-{{ t.name }}">{{ t.name }}</label>
                <div class="ui-inputgroup labelMarginTop">
                    <span class="ui-inputgroup-addon leftBackgroundColor"
                        >L</span
                    >
                    <input
                        type="text"
                        pInputText
                        id="left-{{ t.name }}"
                        [placeholder]="t.name"
                        [required]="t.required"
                        [(ngModel)]="t.leftVal"
                    />
                </div>
            </div>
        </div>
        <div
            class="ui-g-12 ui-md-12 removeMarginAndPadding"
            *ngIf="t.type === 'number'"
        >
            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                <label for="right-{{ t.name }}"> {{ t.name }}</label>
                <div class="ui-inputgroup labelMarginTop">
                    <span class="ui-inputgroup-addon rightBackgroundColor"
                        >R</span
                    >
                    <input
                        type="number"
                        pInputText
                        id="right-{{ t.name }}"
                        [placeholder]="t.name"
                        [required]="t.required"
                        [(ngModel)]="t.rightVal"
                    />
                    <span class="ui-inputgroup-addon">{{
                        t.unit ? t.unit : ""
                    }}</span>
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="left-{{ t.name }}"> {{ t.name }}</label>
                <div class="ui-inputgroup labelMarginTop">
                    <span class="ui-inputgroup-addon leftBackgroundColor"
                        >L</span
                    >
                    <input
                        type="number"
                        pInputText
                        [min]="t.minimum"
                        [max]="t.maximum"
                        id="left-{{ t.name }}"
                        [placeholder]="t.name"
                        [required]="t.required"
                        [(ngModel)]="t.leftVal"
                    />
                    <span class="ui-inputgroup-addon">
                        {{ t.unit ? t.unit : "" }}</span
                    >
                </div>
            </div>
        </div>
        <div
            class="ui-g-12 ui-md-12 removeMarginAndPadding"
            *ngIf="t.type === 'boolean'"
        >
            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                <div class="ui-inputgroup">
                    <span
                        class="ui-inputgroup-addon rightBackgroundColor lineHeight"
                        >R</span
                    >
                    <p-checkbox
                        label=" {{ t.name }}"
                        [value]="t.name"
                        [required]="t.required"
                        [(ngModel)]="t.rightVal"
                    ></p-checkbox>
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <div class="ui-inputgroup">
                    <span
                        class="ui-inputgroup-addon leftBackgroundColor lineHeight"
                        >L</span
                    >
                    <p-checkbox
                        label="{{ t.name }}"
                        [value]="t.name"
                        [required]="t.required"
                        [(ngModel)]="t.leftVal"
                    ></p-checkbox>
                </div>
            </div>
        </div>
        <div
            class="ui-g-12 ui-md-12 removeMarginAndPadding"
            *ngIf="t.type === 'list'"
        >
            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                <label for="right-{{ t.name }}"> {{ t.name }}</label>
                <div class="ui-inputgroup labelMarginTop">
                    <span class="ui-inputgroup-addon rightBackgroundColor"
                        >R</span
                    >
                    <p-dropdown
                        [options]="t.values"
                        placeholder="Select Value"
                        optionLabel="name"
                        id="right-{{ t.name }}"
                        [showClear]="true"
                        [required]="t.required"
                        [(ngModel)]="t.rightVal"
                    ></p-dropdown>
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="left-{{ t.name }}"> {{ t.name }}</label>
                <div class="ui-inputgroup labelMarginTop">
                    <span class="ui-inputgroup-addon leftBackgroundColor"
                        >L</span
                    >
                    <p-dropdown
                        [options]="t.values"
                        placeholder="Select Value"
                        optionLabel="name"
                        id="left-{{ t.name }}"
                        [showClear]="true"
                        [required]="t.required"
                        [(ngModel)]="t.leftVal"
                    ></p-dropdown>
                </div>
            </div>
        </div>
        <div class="removeMarginAndPadding" *ngIf="t.type === 'image'">
            <div class="ui-g-12 ui-md-6 rightVerticalLine">
                <ng-container
                    *ngIf="savedRightImage.length > 0; else NoRightImage"
                >
                    <div class="ui-g-12 ui-md-12">
                        <div class="photoStyle">
                            <img
                                [src]="appendUrl(savedRightImage[0].Key)"
                                height="100%"
                                width="100%"
                            />
                        </div>
                        <div class="buttonStyle ui-g-12 ui-md-12 noPadding">
                            <div class="ui-g-12 ui-md-6 noPadding">
                                <p-fileUpload
                                    mode="basic"
                                    name="demo[]"
                                    accept="image/*"
                                    maxFileSize="100000000"
                                    chooseLabel="Replace"
                                    (onSelect)="
                                        replaceRightImage(
                                            $event,
                                            savedRightImage[0]
                                        )
                                    "
                                ></p-fileUpload>
                            </div>
                            <div class="ui-g-12 ui-md-6 noPadding">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    label="Remove"
                                    class="ui-button-danger"
                                    (click)="
                                        removeRightImage(savedRightImage[0])
                                    "
                                ></button>
                            </div>
                        </div>
                    </div>
                </ng-container>
                <ng-template #NoRightImage>
                    <div class="ui-g-12 ui-md-12">
                        <div class="photoStyle">
                            <ng-container
                                *ngIf="previewRightImageUrl; else elseTemplate"
                            >
                                <img
                                    [src]="previewRightImageUrl"
                                    height="100%"
                                    width="100%"
                                />
                            </ng-container>
                            <ng-template #elseTemplate>
                                <div class="centerText">No Image Chosen</div>
                            </ng-template>
                        </div>
                        <div class="buttonStyle">
                            <ng-container
                                *ngIf="showRightButtons; else noUploadRight"
                            >
                                <p-fileUpload
                                    mode="basic"
                                    name="demo[]"
                                    accept="image/*"
                                    maxFileSize="100000000"
                                    chooseLabel="Choose Image"
                                    (onSelect)="previewRightImage($event)"
                                ></p-fileUpload>
                            </ng-container>
                            <ng-template #noUploadRight>
                                <div
                                    class="buttonStyle ui-g-12 ui-md-12 noPadding"
                                >
                                    <div class="ui-g-12 ui-md-6 noPadding">
                                        <p-fileUpload
                                            mode="basic"
                                            name="demo[]"
                                            accept="image/*"
                                            maxFileSize="100000000"
                                            chooseLabel="Replace"
                                            (onSelect)="
                                                replaceChoosedRightImage($event)
                                            "
                                        ></p-fileUpload>
                                    </div>
                                    <div class="ui-g-12 ui-md-6 noPadding">
                                        <button
                                            type="button"
                                            pButton
                                            icon="pi pi-times"
                                            label="Remove"
                                            class="ui-button-danger"
                                            (click)="removeChoosedRightImage()"
                                        ></button>
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                    </div>
                </ng-template>
            </div>
            <div class="ui-g-12 ui-md-6">
                <ng-container
                    *ngIf="savedLeftImage.length > 0; else NoLeftImage"
                >
                    <div class="ui-g-12 ui-md-12">
                        <div class="photoStyle">
                            <img
                                [src]="appendUrl(savedLeftImage[0].Key)"
                                height="100%"
                                width="100%"
                            />
                        </div>
                        <div class="buttonStyle ui-g-12 ui-md-12 noPadding">
                            <div class="ui-g-12 ui-md-6 noPadding">
                                <p-fileUpload
                                    mode="basic"
                                    name="demo[]"
                                    accept="image/*"
                                    maxFileSize="100000000"
                                    chooseLabel="Replace"
                                    (onSelect)="
                                        replaceLeftImage(
                                            $event,
                                            savedLeftImage[0]
                                        )
                                    "
                                ></p-fileUpload>
                            </div>
                            <div class="ui-g-12 ui-md-6 noPadding">
                                <button
                                    type="button"
                                    pButton
                                    icon="pi pi-times"
                                    label="Remove"
                                    class="ui-button-danger"
                                    (click)="removeLeftImage(savedLeftImage[0])"
                                ></button>
                            </div>
                        </div>
                    </div>
                </ng-container>
                <ng-template #NoLeftImage>
                    <div class="ui-g-12 ui-md-12">
                        <div class="photoStyle">
                            <ng-container
                                *ngIf="previewLeftImageUrl; else elseTemplate"
                            >
                                <img
                                    [src]="previewLeftImageUrl"
                                    height="100%"
                                    width="100%"
                                />
                            </ng-container>
                            <ng-template #elseTemplate>
                                <div class="centerText">No Image Chosen</div>
                            </ng-template>
                        </div>
                        <div class="buttonStyle">
                            <ng-container
                                *ngIf="showLeftButtons; else noLeftUpload"
                            >
                                <p-fileUpload
                                    mode="basic"
                                    name="demo[]"
                                    accept="image/*"
                                    maxFileSize="100000000"
                                    chooseLabel="Choose Image"
                                    (onSelect)="previewLeftImage($event)"
                                ></p-fileUpload>
                            </ng-container>
                            <ng-template #noLeftUpload>
                                <div
                                    class="buttonStyle ui-g-12 ui-md-12 noPadding"
                                >
                                    <div class="ui-g-12 ui-md-6 noPadding">
                                        <p-fileUpload
                                            mode="basic"
                                            name="demo[]"
                                            accept="image/*"
                                            maxFileSize="100000000"
                                            chooseLabel="Replace"
                                            (onSelect)="
                                                replaceChoosedLeftImage($event)
                                            "
                                        ></p-fileUpload>
                                    </div>
                                    <div class="ui-g-12 ui-md-6 noPadding">
                                        <button
                                            type="button"
                                            pButton
                                            icon="pi pi-times"
                                            label="Remove"
                                            class="ui-button-danger"
                                            (click)="removeChoosedLeftImage()"
                                        ></button>
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
        <div class="removeMarginAndPadding" *ngIf="t.type === 'file'">
            <ng-container *ngIf="savedRightFiles.length > 0; else elseTemplate">
                <div class="ui-g-12 ui-md-6 rightVerticalLine">
                    <label> {{ t.name }}</label>
                    <div
                        class="ui-g-12"
                        *ngFor="let document of savedRightFiles"
                    >
                        <p-card
                            class="centerHeader"
                            [style]="{ height: '90px' }"
                            styleClass="ui-card-shadow"
                        >
                            <p-header>
                                <a
                                    href="javascript:void(0)"
                                    class="iconStyle"
                                    (click)="deleteRightDocument(document)"
                                    title="Remove"
                                >
                                    <i
                                        class="fa fa-trash-o"
                                        aria-hidden="true"
                                    ></i>
                                </a>
                            </p-header>
                            <div
                                (click)="viewDocument(document)"
                                class="pointerCursor"
                            >
                                <div class="ui-g-12 ui-md-12 bold">
                                    <div class="ui-g-12 ui-md-2">
                                        <app-files-icons
                                            [key]="document.Key"
                                        ></app-files-icons>
                                    </div>
                                    <div class="ui-g-12 ui-md-10">
                                        {{ removeFileRightKey(document.Key) }}
                                        <br />
                                        {{ formatBytes(document.Size) }}
                                    </div>
                                </div>
                            </div>
                        </p-card>
                    </div>
                </div>
            </ng-container>
            <ng-template #elseTemplate>
                <div class="ui-g-12 ui-md-6 rightVerticalLine">
                    <label for="img">Choose {{ t.name }}</label>
                    <div class="labelMarginTop">
                        <p-fileUpload
                            maxFileSize="100000000"
                            customUpload="true"
                            name="file"
                            ngDefaultControl
                            [showUploadButton]="false"
                            (onSelect)="selectedRightFiles($event)"
                        >
                        </p-fileUpload>
                    </div>
                </div>
            </ng-template>
            <ng-container *ngIf="savedLeftFiles.length > 0; else elseTemplate2">
                <div class="ui-g-12 ui-md-6">
                    <label> {{ t.name }}</label>
                    <div
                        class="ui-g-12"
                        *ngFor="let document of savedLeftFiles"
                    >
                        <p-card
                            class="centerHeader"
                            [style]="{ height: '90px' }"
                            styleClass="ui-card-shadow"
                        >
                            <p-header>
                                <a
                                    href="javascript:void(0)"
                                    class="iconStyle"
                                    (click)="deleteLeftDocument(document)"
                                    title="Remove"
                                >
                                    <i
                                        class="fa fa-trash-o"
                                        aria-hidden="true"
                                    ></i>
                                </a>
                            </p-header>
                            <div
                                (click)="viewDocument(document)"
                                class="pointerCursor"
                            >
                                <div class="ui-g-12 ui-md-12 bold">
                                    <div class="ui-g-12 ui-md-2">
                                        <app-files-icons
                                            [key]="document.Key"
                                        ></app-files-icons>
                                    </div>
                                    <div class="ui-g-12 ui-md-10">
                                        {{ removeFileLeftKey(document.Key) }}
                                        <br />
                                        {{ formatBytes(document.Size) }}
                                    </div>
                                </div>
                            </div>
                        </p-card>
                    </div>
                </div>
            </ng-container>
            <ng-template #elseTemplate2>
                <div class="ui-g-12 ui-md-6">
                    <label for="img">Choose {{ t.name }}</label>
                    <div class="labelMarginTop">
                        <p-fileUpload
                            maxFileSize="100000000"
                            customUpload="true"
                            name="file"
                            ngDefaultControl
                            [showUploadButton]="false"
                            (onSelect)="selectedLeftFiles($event)"
                        >
                        </p-fileUpload>
                    </div>
                </div>
            </ng-template>
        </div>
        <div class="ui-g-12 ui-md-12" *ngIf="t.type === 'textarea'">
            <label>{{ t.name }}</label>
            <div class="labelMarginTop">
                <textarea
                    [rows]="5"
                    [cols]="30"
                    pInputTextarea
                    autoResize="autoResize"
                    [placeholder]="t.name"
                    [required]="t.required"
                    [(ngModel)]="t.textareaVal"
                ></textarea>
            </div>
        </div>
        <div class="ui-g-12 ui-md-12" *ngIf="t.type === 'table'">
            <label> {{ t.name }}</label>
            <div class="labelMarginTop">
                <p-table>
                    <ng-template pTemplate="header">
                        <tr>
                            <th>{{ t.xAxisName }}</th>
                            <th *ngFor="let data of t.cells">
                                {{ data.name }}
                            </th>
                        </tr>

                        <tr>
                            <th class="rightColor">Right</th>
                            <ng-container *ngIf="t.cellType === 'boolean'">
                                <th *ngFor="let freq of t.cells">
                                    <p-dropdown
                                        [options]="t.cellValues"
                                        placeholder="Y/N"
                                        optionLabel="name"
                                        [showClear]="true"
                                        [(ngModel)]="freq.right"
                                    ></p-dropdown>
                                </th>
                            </ng-container>
                            <ng-container *ngIf="t.cellType === 'number'">
                                <th *ngFor="let freq of t.cells">
                                    <input
                                        type="number"
                                        pInputText
                                        [(ngModel)]="freq.right"
                                    />
                                </th>
                            </ng-container>
                        </tr>
                        <tr>
                            <th class="leftColor">Left</th>
                            <ng-container *ngIf="t.cellType === 'boolean'">
                                <th *ngFor="let freq of t.cells">
                                    <p-dropdown
                                        [options]="t.cellValues"
                                        placeholder="Y/N"
                                        optionLabel="name"
                                        [showClear]="true"
                                        [(ngModel)]="freq.left"
                                    ></p-dropdown>
                                </th>
                            </ng-container>
                            <ng-container *ngIf="t.cellType === 'number'">
                                <th *ngFor="let freq of t.cells">
                                    <input
                                        type="number"
                                        pInputText
                                        [(ngModel)]="freq.left"
                                    />
                                </th>
                            </ng-container>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</div>
