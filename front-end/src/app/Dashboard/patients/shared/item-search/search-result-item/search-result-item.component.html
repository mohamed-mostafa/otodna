<div class="marginBottom">
    <app-item-search
        [items]="items"
        [itemSearch]="itemSearch"
        (filterEvent)="searchItems($event)"
        [displayName]="displayName"
    ></app-item-search>
</div>
<p-breadcrumb
    *ngIf="showBreadCrumb"
    [model]="breadcrumbItems"
    [home]="breadcrumbIcon"
></p-breadcrumb>
<div *ngFor="let item of items">
    <div
        class="ui-g-12 ui-md-4"
        *ngIf="!item.show"
        (click)="openTestData(item)"
    >
        <p-card
            class="centerHeader pointerCursor"
            [style]="{ height: '80px' }"
            styleClass="ui-card-shadow cardBorderRadius"
        >
            <span>
                {{ item[displayName] }}
            </span>
            <p-footer *ngIf="item.children">
                <span style="float: right"
                    ><i class="fa fa-arrow-right"></i
                ></span>
            </p-footer>
        </p-card>
    </div>
</div>
<ngx-spinner></ngx-spinner>
