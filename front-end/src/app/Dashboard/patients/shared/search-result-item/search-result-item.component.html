<p-breadcrumb
    *ngIf="showBreadCrumb"
    [model]="items"
    [home]="home"
></p-breadcrumb>
<div
    class="ui-g-12 ui-md-4"
    *ngFor="let test of tests"
    (click)="openTestData(test)"
>
    <p-card
        class="centerHeader pointerCursor"
        [style]="{ height: '80px' }"
        styleClass="ui-card-shadow cardBorderRadius"
    >
        <span>
            {{ test.diseaseName }}
        </span>
        <p-footer *ngIf="test.children">
            <span style="float: right"><i class="fa fa-arrow-right"></i></span>
        </p-footer>
    </p-card>
</div>
