<ng-container
    *ngIf="
        frequentlyUsedTests && frequentlyUsedTests.length > 0;
        else elseTemplate
    "
>
    <div
        class="ui-g-12 ui-md-12 marginTop"
        *ngFor="let test of frequentlyUsedTests"
        (click)="openTest(test)"
    >
        <a class="centerHeader pointerCursor" *ngIf="type === 'test'">
            {{ test.testName }}</a
        >
        <a class="centerHeader pointerCursor" *ngIf="type === 'treatment'">
            {{ test.treatmentName }}</a
        >
        <a class="centerHeader pointerCursor" *ngIf="type === 'pathology'">
            {{ test.deseaseName }}</a
        >
    </div>
</ng-container>
<ng-template #elseTemplate>
    <div class="ui-g-12 ui-md-12 NoDataToShow">No Data To Show</div>
</ng-template>
