<ng-container
    *ngIf="
        frequentlyUsedTests && frequentlyUsedTests.length > 0;
        else elseTemplate
    "
>
    <div
        class="ui-g-12 ui-md-12 leftAlign"
        *ngFor="let test of frequentlyUsedTests"
        (click)="openTest(test)"
    >
        <ul>
            <li *ngIf="type === 'test'">
                <a class="pointerCursor"> {{ test.testName }}</a>
            </li>
            <li *ngIf="type === 'treatment' || type === 'candidacy'">
                <a class="pointerCursor"> {{ test.treatmentName }}</a>
            </li>
            <li *ngIf="type === 'pathology'">
                <a class="pointerCursor"> {{ test.deseaseName }}</a>
            </li>
        </ul>
    </div>
</ng-container>
<ng-template #elseTemplate>
    <div class="ui-g-12 ui-md-12 NoDataToShow">Nothing to show yet !</div>
</ng-template>
