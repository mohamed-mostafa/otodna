<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-dialog
    header="Add Family Member"
    [(visible)]="displayBasic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
>
    <div style="height: 150px;">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-6">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Family member name"
                        [(ngModel)]="family.familyMemberName"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <div class="ui-inputgroup">
                    <p-dropdown
                        [options]="relations"
                        placeholder="Select Relation"
                        optionLabel="name"
                        id="relation"
                        [showClear]="true"
                        [(ngModel)]="familyMemberRelation"
                    ></p-dropdown>
                </div>
            </div>
        </div>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancel()"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="save()"
            label="Save"
        ></button>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Patient Family</h2></div>
    <div class="ui-g-3" *ngFor="let family of families">
        <p-card
            class="centerHeader"
            [style]="{ height: '120px' }"
            styleClass="ui-card-shadow"
        >
            <div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ family.familyMemberName }}
                </div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ family.relationName }}
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-3">
        <div style="border-style: dotted;">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '115px' }"
                (click)="showDialog()"
            >
                <h3 style="margin-top: 30px;">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px;"
                    ></i>
                    Add Family Member
                </h3>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
