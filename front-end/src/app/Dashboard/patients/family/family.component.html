<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-9"></div>
    <div class="ui-g-12 ui-md-3">
        <button
            type="button"
            (click)="showDialog()"
            pButton
            icon="pi pi-external-link"
            label="Add Family Member"
        ></button>
    </div>
</div>
<p-dialog
    header="Add Family Member"
    [(visible)]="displayBasic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
>
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    placeholder="Family member name"
                    [(ngModel)]="family.familyMemberName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    placeholder="Relation"
                    [(ngModel)]="family.relation"
                />
            </div>
        </div>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancel()"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="save()"
            label="Save"
        ></button>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12">
        <div class="card card-w-title">
            <p-table
                #dt
                [columns]="cols"
                styleClass="ui-table-cars"
                [value]="families"
                [paginator]="showPagination"
                [rows]="10"
                dataKey="vin"
                selectionMode="single"
            >
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            [pSortableColumn]="col.field"
                            [ngSwitch]="col.field"
                            [ngStyle]="{ width: col.width }"
                        >
                            {{ col.header }}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                    </tr>
                    <tr *ngIf="!showPagination">
                        <h3>No Data Found</h3>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                        <td>{{ rowData.familyMemberName }}</td>
                        <td>{{ rowData.relation }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
