<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-dialog
    header="Add Problem"
    [(visible)]="displayBasic"
    [style]="{ width: '60vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
>
    <p-card [style]="{ height: '300px' }">
        <div class="ui-g ui-fluid">
            <!-- <div class="ui-g-12 ui-md-4">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Problem"
                        [(ngModel)]="problem.problem"
                    />
                </div>
            </div> -->
            <div class="ui-g-12 ui-md-5">
                <p-dropdown
                    [options]="statuses"
                    placeholder="Select Status"
                    optionLabel="name"
                    [showClear]="true"
                    [(ngModel)]="status"
                ></p-dropdown>
            </div>
            <div class="ui-g-12 ui-md-7">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Noted Date"
                    [showIcon]="true"
                    [(ngModel)]="problem.notedDate"
                    showButtonBar="true"
                ></p-calendar>
            </div>
            <div class="ui-g-12 ui-md-12">
                <textarea
                    [rows]="7"
                    [cols]="30"
                    pInputTextarea
                    autoResize="autoResize"
                    placeholder="Comments"
                    [(ngModel)]="problem.comment"
                ></textarea>
            </div>
        </div>
    </p-card>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancel()"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="save()"
            label="Save"
        ></button>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Patient Problems</h2></div>
    <div class="ui-g-3" *ngFor="let problem of problems">
        <p-card
            class="centerHeader"
            [style]="{ height: '90px' }"
            styleClass="ui-card-shadow"
        >
            <div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ problem.statusName }}
                </div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ problem.notedDate | date }}
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-3">
        <div style="border-style: dotted;">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '85px' }"
                (click)="showDialog()"
            >
                <h3 style="margin-top: 30px;">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px;"
                    ></i>
                    Add Problem
                </h3>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
