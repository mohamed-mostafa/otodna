<p-toast></p-toast>
<app-patient-breadcrumb
    [firstName]="selectedPatient.firstName"
    [lastName]="selectedPatient.lastName"
></app-patient-breadcrumb
><p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<app-patient-summary></app-patient-summary>
<p-dialog
    header="Problem"
    [(visible)]="displayBasic"
    [style]="{ width: '60vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onHide()"
>
    <p-card [style]="{ height: '300px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-5">
                <p-dropdown
                    [options]="statuses"
                    placeholder="Select Status"
                    optionLabel="name"
                    [showClear]="true"
                    [(ngModel)]="status"
                ></p-dropdown>
            </div>
            <div class="ui-g-12 ui-md-7">
                <p-calendar
                    [readonlyInput]="true"
                    placeholder="Noted Date"
                    [showIcon]="true"
                    [(ngModel)]="problem.notedDate"
                    showButtonBar="true"
                ></p-calendar>
            </div>
            <div class="ui-g-12 ui-md-12">
                <textarea
                    [rows]="7"
                    [cols]="30"
                    pInputTextarea
                    autoResize="autoResize"
                    placeholder="Comments"
                    [(ngModel)]="problem.comment"
                ></textarea>
            </div>
        </div>
    </p-card>
    <p-footer *ngIf="showAllButtons">
        <ng-container *ngIf="showSaveButton; else elseTemplate">
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="save()"
                label="Save"
            ></button
        ></ng-container>
        <ng-template #elseTemplate>
            <button
                type="button"
                pButton
                icon="pi pi-times"
                (click)="cancel()"
                label="Cancel"
                class="ui-button-secondary"
            ></button>
            <button
                type="button"
                pButton
                icon="pi pi-check"
                (click)="update()"
                label="Update"
            ></button
        ></ng-template>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-3" *ngFor="let problem of problems">
        <p-card
            class="centerHeader"
            [style]="{ height: '95px' }"
            styleClass="ui-card-shadow"
        >
            <div (click)="viewData(problem)" class="pointerCursor">
                <div class="ui-g-12 ui-md-12 bold">
                    {{ problem.statusName }}
                </div>
                <div class="ui-g-12 ui-md-12 bold">
                    {{ problem.notedDate | date }}
                </div>
            </div>
            <p-footer *ngIf="showAllButtons">
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteProblem(problem)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-footer>
        </p-card>
    </div>
    <div class="ui-g-3" *ngIf="showAllButtons">
        <div style="border-style: dotted">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '90px' }"
                (click)="showDialog()"
            >
                <h3 style="margin-top: 20px">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px"
                    ></i>
                    Add Problem
                </h3>
            </p-card>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
