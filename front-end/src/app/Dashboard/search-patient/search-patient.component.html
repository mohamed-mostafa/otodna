<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-12">
        <div class="card card-w-title">
            <h1>Search Patients</h1>
            <div class="ui-inputgroup">
                <input type="text" pInputText placeholder="Keyword" />
                <button
                    pButton
                    type="button"
                    label="Search"
                    class="marginRight"
                    (click)="search()"
                ></button>
                <button
                    pButton
                    type="button"
                    label="Advanced Search"
                    (click)="showAdvancedSearch()"
                ></button>
            </div>
        </div>
    </div>
    <div class="ui-g-12 ui-md-12" *ngIf="show">
        <div class="card card-w-title">
            <h1>Advanced Search</h1>
            <div class="ui-g form-group">
                <div class="ui-g-12 ui-md-4">
                    <div class="ui-inputgroup">
                        <span class="ui-inputgroup-addon"
                            ><i class="pi pi-user"></i
                        ></span>
                        <input
                            type="text"
                            pKeyFilter="alphanum"
                            pInputText
                            placeholder="Username"
                        />
                    </div>
                </div>
                <div class="ui-g-12 ui-md-4">
                    <div class="ui-inputgroup">
                        <span class="ui-inputgroup-addon"
                            ><i class="fa fa-envelope"></i
                        ></span>
                        <input type="text" pInputText placeholder="Email" />
                    </div>
                </div>
                <div class="ui-g-12 ui-md-4">
                    <div class="ui-inputgroup">
                        <span class="ui-inputgroup-addon"
                            ><i class="fa fa-phone"></i
                        ></span>
                        <input
                            type="text"
                            pInputText
                            pKeyFilter="int"
                            placeholder="Phone"
                        />
                    </div>
                </div>
                <div class="ui-g-12 ui-md-6">
                    <p-calendar
                        selectionMode="range"
                        [readonlyInput]="true"
                        placeholder="Last Modified"
                        [showIcon]="true"
                    ></p-calendar>
                </div>
                <div class="ui-g-12 ui-md-6">
                    <p-dropdown
                        [options]="teams"
                        placeholder="All team"
                        filter="true"
                    >
                        <ng-template let-team pTemplate="item">
                            <div
                                class="ui-helper-clearfix"
                                style="position: relative; height: 25px;"
                            >
                                <div>
                                    {{ team.label }}
                                </div>
                            </div>
                        </ng-template>
                    </p-dropdown>
                </div>
                <div class="ui-g-12 ui-md-5"></div>
                <div class="ui-g-12 ui-md-2">
                    <button
                        pButton
                        type="button"
                        label="Search"
                        (click)="search()"
                        style="margin-bottom: 10px;"
                        class="ui-button-info ui-button-raised"
                    ></button>
                </div>
                <div class="ui-g-12 ui-md-5"></div>
            </div>
        </div>
    </div>
    <div class="ui-g-12">
        <div class="card card-w-title">
            <p-table
                #dt
                [columns]="cols"
                styleClass="ui-table-cars"
                [value]="teams"
                [paginator]="true"
                [rows]="10"
                dataKey="vin"
                selectionMode="single"
                [(selection)]="selectedTeam"
            >
                <ng-template pTemplate="caption">
                    <div class="ui-table-globalfilter-container">
                        <input
                            type="text"
                            pInputText
                            size="50"
                            placeholder="Global Filter"
                            (input)="
                                dt.filterGlobal($event.target.value, 'contains')
                            "
                            style="width: 250px;"
                        />
                    </div>
                </ng-template>
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            [pSortableColumn]="col.field"
                            [ngSwitch]="col.field"
                        >
                            {{ col.header }}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                        <th style="width: 8em; text-align: center;">
                            <button
                                pButton
                                type="button"
                                icon="pi pi-cog"
                            ></button>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                        <td>{{ rowData.id }}</td>
                        <td>{{ rowData.username }}</td>
                        <td>{{ rowData.phone }}</td>
                        <td>{{ rowData.lastActionDate }}</td>
                        <td>{{ rowData.lastAction }}</td>
                        <td>{{ rowData.team }}</td>
                        <td>
                            <button
                                pButton
                                type="button"
                                class="ui-button-success"
                                icon="pi pi-search"
                                style="margin-right: 0.5em;"
                            ></button>
                            <button
                                pButton
                                type="button"
                                class="ui-button-warning"
                                icon="pi pi-pencil"
                            ></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
