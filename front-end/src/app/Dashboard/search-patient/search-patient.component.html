<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-12" *ngIf="show2">
        <div class="card card-w-title">
            <h1>Search Patients</h1>
            <div class="ui-g form-group">
                <div class="ui-g-12 ui-md-10">
                    <div class="ui-inputgroup">
                        <input type="text" pInputText placeholder="Keyword" />
                        <button
                        pButton
                        type="button"
                        label="Search"
                        class="marginRight"
                        (click)="search()"
                    ></button>
                    </div>
                </div>
              
                <div class="ui-g-12 ui-md-2 marginTop">
                    <a href="javascript:void(0)" (click)="showSearch()">Advanced Search</a>
                </div>
            </div>
        </div>
    </div>
    <div class="ui-g-12 ui-md-12" *ngIf="show">
        <div class="card card-w-title">
            <h1 class="displayInline">Advanced Search</h1>
            <div class="displayInline sampleSearch">
                <a href="javascript:void(0)" (click)="showSearch()">Simple Search</a>
            </div>
            <div class="ui-g form-group dataMarinTop">
                <div class="ui-g-12 ui-md-2">
                    <div class="ui-inputgroup">
                        <span class="ui-inputgroup-addon"
                            ><i class="pi pi-user"></i
                        ></span>
                        <input
                            type="text"
                            pKeyFilter="alphanum"
                            pInputText
                            placeholder="Patient Name"
                        />
                    </div>
                </div>
                <div class="ui-g-12 ui-md-3">
                    <div class="ui-inputgroup">
                        <span class="ui-inputgroup-addon"
                            ><i class="fa fa-envelope"></i
                        ></span>
                        <input type="text" pInputText placeholder="Email" />
                    </div>
                </div>
                <div class="ui-g-12 ui-md-2">
                    <div class="ui-inputgroup">
                        <span class="ui-inputgroup-addon"
                            ><i class="fa fa-phone"></i
                        ></span>
                        <input
                            type="text"
                            pInputText
                            pKeyFilter="int"
                            placeholder="Phone"
                        />
                    </div>
                </div>
                <div class="ui-g-12 ui-md-3">
                    <p-calendar
                        selectionMode="range"
                        [readonlyInput]="true"
                        placeholder="Last Modified"
                        [showIcon]="true"
                    ></p-calendar>
                </div>
                <div class="ui-g-12 ui-md-2 marginTop"><p-checkbox name="group1" value="New York"
                     label="All Teams"  inputId="ny"></p-checkbox>
                </div>
                <div class="ui-g-12 ui-md-5"></div>
                <div class="ui-g-12 ui-md-2">
                    <button
                        pButton
                        type="button"
                        label="Search"
                        (click)="search()"
                        style="margin-bottom: 10px;"
                        class="ui-button-info ui-button-raised"
                    ></button>
                </div>
                <div class="ui-g-12 ui-md-5"></div>
            </div>
        </div>
    </div>
    <div class="ui-g-12">
        <div class="card card-w-title">
            <p-table
                #dt
                [columns]="cols"
                styleClass="ui-table-cars"
                [value]="teams"
                [paginator]="true"
                [rows]="10"
                dataKey="vin"
                selectionMode="single"
                [(selection)]="selectedTeam"
            >
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            [pSortableColumn]="col.field"
                            [ngSwitch]="col.field"
                        >
                            {{ col.header }}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                        <td>{{ rowData.id }}</td>
                        <td>{{ rowData.username }}</td>
                        <td>{{ rowData.phone }}</td>
                        <td>{{ rowData.lastActionDate }}</td>
                        <td>{{ rowData.lastAction }}</td>
                        <td>{{ rowData.team }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
