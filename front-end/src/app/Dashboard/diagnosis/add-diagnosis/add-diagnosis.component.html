<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-fieldset legend="Patient Session">
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    placeholder="Display Name"
                    [(ngModel)]="diagnosis.displayName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-4">
            <p-calendar
                [readonlyInput]="true"
                placeholder="Date"
                [showIcon]="true"
                [(ngModel)]="diagnosis.date"
                [monthNavigator]="true"
                [yearNavigator]="true"
                yearRange="1950:2020"
            ></p-calendar>
        </div>
        <div class="ui-g-12 ui-md-4">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    placeholder="Created By"
                    [disabled]="true"
                    [(ngModel)]="diagnosis.createdBy"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <p-calendar
                [readonlyInput]="true"
                placeholder="Created At"
                [showIcon]="true"
                [disabled]="true"
                [(ngModel)]="diagnosis.createdAt"
                [monthNavigator]="true"
                [yearNavigator]="true"
                yearRange="1950:2020"
            ></p-calendar>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <span class="ui-inputgroup-addon backgroundColor"
                    ><i class="pi pi-user"></i
                ></span>
                <input
                    type="text"
                    pInputText
                    placeholder="Performer"
                    [(ngModel)]="diagnosis.performer"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-12">
            <textarea
                [rows]="5"
                [cols]="30"
                pInputTextarea
                autoResize="autoResize"
                placeholder="Notes"
                [(ngModel)]="diagnosis.notes"
            ></textarea>
        </div>
    </div>
</p-fieldset>
<p-fieldset legend="Symptoms">
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-6" *ngFor="let sym of symptomsArray">
            <div class="p-grid" style="margin-bottom: 5px;">
                <div class="p-col-12">
                    <p-checkbox
                        name="group1"
                        [value]="sym"
                        [label]="sym"
                        [(ngModel)]="diagnosis.symptoms"
                        [inputId]="sym"
                    ></p-checkbox>
                </div>
            </div>
        </div>
    </div>
</p-fieldset>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-8"></div>
    <div class="ui-g-12 ui-md-2">
        <button
            pButton
            type="button"
            label="Discard"
            (click)="reset()"
            style="margin-bottom: 10px;"
            class="ui-button-danger ui-button-raised"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-2">
        <button
            pButton
            type="button"
            label="Save"
            (click)="save()"
            style="margin-bottom: 10px;"
            class="ui-button-icon-primary ui-button-raised"
        ></button>
    </div>
</div>
<ngx-spinner></ngx-spinner>
