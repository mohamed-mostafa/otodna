<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-3">
        <button
            #btn
            type="button"
            pButton
            icon="pi pi-bars"
            label="Add Test"
            (click)="menu.toggle($event)"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-9"></div>
</div>
<p-slideMenu
    #menu
    [model]="testMenu"
    [popup]="true"
    [viewportHeight]="330"
    [style]="{ width: '600px' }"
    [menuWidth]="600"
></p-slideMenu>
<p-dialog
    [header]="dialogName"
    [(visible)]="displayAcoustic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
>
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-6">
            <p-dropdown
                [options]="acousticTympanogram"
                placeholder="Select Tympanogram"
                optionLabel="name"
                [showClear]="true"
                [(ngModel)]="acoustic.tympanogram"
            ></p-dropdown>
        </div>
        <div class="ui-g-12 ui-md-3">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    placeholder="Right"
                    [(ngModel)]="acoustic.rightTympanogram"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-3">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    placeholder="Left"
                    [(ngModel)]="acoustic.leftTympanogram"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Right Compliance"
                    [(ngModel)]="acoustic.rightCompliance"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Left Compliance"
                    [(ngModel)]="acoustic.leftCompliance"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Right Peak Pressuer"
                    [(ngModel)]="acoustic.rightPeakPressuer"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Left Peak Pressuer"
                    [(ngModel)]="acoustic.leftPeakPressuer"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Right Ear Canal Volume"
                    [(ngModel)]="acoustic.rightEarCanalVolume"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    pKeyFilter="int"
                    placeholder="Left Ear Canal Volume"
                    [(ngModel)]="acoustic.leftEarCanalVolume"
                />
            </div>
        </div>
        <p-table>
            <ng-template pTemplate="header">
                <tr>
                    <th>Freq</th>
                    <th *ngFor="let freq of frequencyTable">{{ freq }}</th>
                </tr>
                <tr>
                    <th>Right</th>
                    <th *ngFor="let freq of frequencyTable">
                        <p-dropdown
                            [options]="acousticReflex"
                            placeholder="Y/N"
                            optionLabel="name"
                            [showClear]="true"
                        ></p-dropdown>
                    </th>
                </tr>
                <tr>
                    <th>Left</th>
                    <th *ngFor="let freq of frequencyTable">
                        <p-dropdown
                            [options]="acousticReflex"
                            placeholder="Y/N"
                            optionLabel="name"
                            [showClear]="true"
                        ></p-dropdown>
                    </th>
                </tr>
            </ng-template>
        </p-table>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancelAcousticDialog()"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="saveAcousticDialog()"
            label="Save"
        ></button>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12">
        <div class="card card-w-title">
            <p-table
                #dt
                [columns]="cols"
                styleClass="ui-table-cars"
                [value]="tests"
                [paginator]="showPagination"
                [resizableColumns]="true"
                [responsive]="true"
                [rows]="10"
                dataKey="vin"
                selectionMode="single"
            >
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            [pSortableColumn]="col.field"
                            [ngSwitch]="col.field"
                            [ngStyle]="{ width: col.width }"
                        >
                            {{ col.header }}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                    </tr>
                    <tr *ngIf="!showPagination">
                        <h3>No Data Found</h3>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Test Type </span>
                            {{ rowData.testType }}
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
