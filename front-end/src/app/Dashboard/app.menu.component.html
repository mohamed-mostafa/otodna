<div class="layout-menu-container" (click)="onMenuClick($event)">
    <ul class="layout-menu">
        <ng-container *ngIf="showMainMenu">
            <li
                app-menuitem
                *ngFor="let item of model; let i = index"
                [item]="item"
                [index]="i"
                [root]="true"
            ></li>
        </ng-container>
        <ng-container *ngIf="showOtherMenu">
            <li
                app-menuitem
                *ngFor="let item of otherMenu; let i = index"
                [item]="item"
                [index]="i"
                [root]="true"
            ></li>
        </ng-container>
    </ul>
</div>
