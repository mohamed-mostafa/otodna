<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Team Members</h2></div>
    <div class="ui-g-12 ui-md-3" *ngFor="let m of members">
        <p-card
            class="centerHeader"
            [style]="{ height: '120px' }"
            styleClass="ui-card-shadow"
            header="{{ m.fullName }}"
        >
            <div>
                <div class="ui-g-6 ui-md-4">
                    <img
                        src="assets/layout/images/doctor.png"
                        height="50px"
                        width="50px"
                        style="border-radius: 15px"
                    />
                </div>
                <div class="ui-g-6 ui-md-8 bold marginTop">
                    {{ m.role.name }}
                </div>
            </div>
            <p-footer>
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteMember(m)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-footer>
        </p-card>
    </div>
    <div class="ui-g-12 ui-md-3">
        <div style="border-style: dotted">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '115px' }"
                (click)="openMemberDialog()"
            >
                <h3 style="margin-top: 30px">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px"
                    ></i>
                    Add Member
                </h3>
            </p-card>
        </div>
    </div>
</div>
<p-dialog
    header="Add Team Member"
    [(visible)]="displayMemberDialog"
    [style]="{ width: '55vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
>
    <p-card [style]="{ height: '150px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <p-dropdown
                    [options]="users"
                    [(ngModel)]="member.member"
                    placeholder="Select A User"
                    optionLabel="fullName"
                    [showClear]="true"
                ></p-dropdown>
            </div>
        </div>
    </p-card>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="displayMemberDialog = false"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="saveMember()"
            label="Add"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner></ngx-spinner>
