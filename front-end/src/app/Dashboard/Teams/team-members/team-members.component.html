<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">Team Members</h2></div>
    <div class="ui-g-6" *ngFor="let m of members">
        <p-card
            class="centerHeader"
            [style]="{ height: '120px' }"
            styleClass="ui-card-shadow"
            header="{{ m.name }}"
        >
            <div>
                <div class="ui-g-12 ui-md-6">
                    <img
                        src="assets/layout/images/doctor.png"
                        height="65px"
                        width="150px"
                        style="border-radius: 15px;"
                    />
                </div>
                <div class="ui-g-12 ui-md-5 bold marginTop">
                    {{ m.role }}
                </div>
                <div class="ui-g-2 ui-md-1 marginTop">
                    <a
                        href="javascript:void(0)"
                        class="iconStyle"
                        (click)="deleteMember(m)"
                    >
                        <i class="fa fa-trash-o" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-6">
        <div style="border-style: dotted;">
            <p-card
                class="centerHeader"
                [style]="{ height: '115px' }"
                header="Click Add New Member To Add A New Member"
            >
                <button
                    type="button"
                    pButton
                    icon="fa fa-user-plus"
                    (click)="openMemberDialog()"
                    label="Add New Member"
                    class="ui-button-primary"
                ></button>
            </p-card>
        </div>
    </div>
</div>
<p-dialog
    header="Add New Team"
    [(visible)]="displayMemberDialog"
    [style]="{ width: '35vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
>
    <p-card [style]="{ height: '150px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <p-dropdown
                    [options]="users"
                    [(ngModel)]="member"
                    placeholder="Select A User"
                    optionLabel="name"
                    [showClear]="true"
                ></p-dropdown>
            </div>
        </div>
    </p-card>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="displayMemberDialog = false"
            label="No"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="saveMember()"
            label="Add"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner></ngx-spinner>
