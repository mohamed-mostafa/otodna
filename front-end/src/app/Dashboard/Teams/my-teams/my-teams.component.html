<p-toast></p-toast>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-6" *ngFor="let t of teams">
        <p-card
            class="centerHeader pointerCursor"
            [style]="{ height: '110px' }"
            styleClass="ui-card-shadow cardBorderRadius"
            header="{{ t.name }} Team"
        >
            <div (click)="openTeamMember(t)">
                <div class="ui-g-12 ui-md-4 bold">
                    Since {{ t.creationDate | date }}
                </div>
                <div class="ui-g-6 ui-md-4 bold">
                    {{ t.department.name }}
                </div>
                <div class="ui-g-6 ui-md-4 bold">
                    {{ t.membersCount }} Member<span *ngIf="t.membersCount > 1"
                        >s</span
                    >
                </div>
            </div>
            <p-footer>
                <a
                    href="javascript:void(0)"
                    class="iconStyle"
                    (click)="deleteTeam(t)"
                    title="Remove"
                >
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                </a>
            </p-footer>
        </p-card>
    </div>
    <div class="ui-g-12 ui-md-6">
        <div style="border-style: dotted">
            <p-card
                class="centerHeader pointerCursor"
                [style]="{ height: '110px' }"
                (click)="openTeamDialog()"
            >
                <h3 style="margin-top: 30px">
                    <i
                        class="fa fa-plus"
                        aira-hidden="true"
                        style="margin: 5px"
                    ></i>
                    New Team
                </h3>
            </p-card>
        </div>
    </div>
</div>
<p-dialog
    header="Add New Team"
    [(visible)]="displayTeamDialog"
    [style]="{ width: '55vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
>
    <p-card [style]="{ height: '250px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <label for="name">Team Name</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        id="name"
                        pInputText
                        placeholder="Team Name"
                        [(ngModel)]="team.name"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="name">Team Owner</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        pInputText
                        placeholder="Team Owner"
                        [(ngModel)]="team.owner"
                        readonly="true"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="name">Team Department</label>
                <div class="labelMarginTop">
                    <p-dropdown
                        [options]="departments"
                        [(ngModel)]="team.department"
                        placeholder="Select A Department"
                        optionLabel="name"
                        [showClear]="true"
                    ></p-dropdown>
                </div>
            </div>
        </div>
    </p-card>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="displayTeamDialog = false"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="saveTeam()"
            label="Add"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner></ngx-spinner>
