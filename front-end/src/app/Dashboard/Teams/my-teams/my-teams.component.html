<p-toast></p-toast>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12"><h2 class="centerHeader">My Teams</h2></div>
    <div class="ui-g-6" *ngFor="let t of teams">
        <p-card
            class="centerHeader"
            [style]="{ height: '160px' }"
            styleClass="ui-card-shadow"
            header="{{ t.name }}"
        >
            <div>
                <div class="ui-g-12 ui-md-6">
                    <div class="ui-inputgroup">
                        <button
                            pButton
                            [disabled]="true"
                            type="button"
                            class="btnColor"
                            label="Owner"
                        ></button>
                        <input
                            type="text"
                            class="centerHeader"
                            pInputText
                            placeholder="Owner"
                            readonly="true"
                            [(ngModel)]="t.owner"
                        />
                    </div>
                </div>
                <div class="ui-g-12 ui-md-6">
                    <div class="ui-inputgroup">
                        <button
                            pButton
                            [disabled]="true"
                            class="btnColor"
                            type="button"
                            label="Department"
                        ></button>
                        <input
                            type="text"
                            pInputText
                            class="centerHeader"
                            placeholder="Department"
                            readonly="true"
                            [(ngModel)]="t.department"
                        />
                    </div>
                </div>
                <div class="ui-g-12 ui-md-6">
                    <button
                        type="button"
                        pButton
                        icon="pi pi-check"
                        (click)="openTeamMember(t)"
                        label="Open Team"
                        class="ui-button-info"
                    ></button>
                </div>
                <div class="ui-g-12 ui-md-6">
                    <button
                        type="button"
                        pButton
                        icon="pi pi-times"
                        (click)="deleteTeam(t)"
                        label="Delete Team"
                        class="ui-button-danger"
                    ></button>
                </div>
            </div>
        </p-card>
    </div>
    <div class="ui-g-6">
        <div style="border-style: dotted;">
            <p-card
                class="centerHeader"
                [style]="{ height: '160px' }"
                header="Add New Team"
            >
                <h3>Click Add New Team To Add A New Team</h3>
                <button
                    type="button"
                    pButton
                    icon="fa fa-user-plus"
                    (click)="openTeamDialog()"
                    label="Add New Team"
                    class="ui-button-primary"
                ></button>
            </p-card>
        </div>
    </div>
</div>
<p-dialog
    header="Add New Team"
    [(visible)]="displayTeamDialog"
    [style]="{ width: '35vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
>
    <p-card [style]="{ height: '200px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Team Name"
                        [(ngModel)]="team.name"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-12">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Team Owner"
                        [(ngModel)]="team.owner"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-12">
                <p-dropdown
                    [options]="departments"
                    [(ngModel)]="team.department"
                    placeholder="Select A Department"
                    optionLabel="name"
                    [showClear]="true"
                ></p-dropdown>
            </div>
        </div>
    </p-card>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="displayTeamDialog = false"
            label="No"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="saveTeam()"
            label="Save"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner></ngx-spinner>
