<p-toast></p-toast>
<h3>Welcome To My Teams Page</h3>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-5"></div>
    <div class="ui-g-2"><h2>My Teams</h2></div>
    <div class="ui-g-5"></div>
    <div class="ui-g-6">
        <p-card header="Alaa Team">
            <div>
                <button
                    type="button"
                    pButton
                    icon="fa fa-users"
                    (click)="showMembers()"
                    label="Show Members"
                    class="ui-button-primary"
                ></button>
            </div>
        </p-card>
    </div>
    <div class="ui-g-6">
        <p-card header="Mostafa Team">
            <div>
                <button
                    type="button"
                    pButton
                    icon="fa fa-users"
                    (click)="showMembers()"
                    label="Show Members"
                    class="ui-button-primary"
                ></button>
            </div>
        </p-card>
    </div>

    <div class="ui-g-12" *ngIf="showTable">
        <div class="ui-g-3">
            <button
                pButton
                type="button"
                class="ui-button-success"
                icon="pi pi-pencil"
                label="Add New Member"
                (click)="addMember()"
            ></button>
        </div>
        <div class="ui-g-9"></div>
        <div class="ui-g-12">
            <div class="card card-w-title">
                <p-table
                    #dt
                    [columns]="cols"
                    styleClass="ui-table-cars"
                    [value]="members"
                    [paginator]="true"
                    [resizableColumns]="true"
                    [responsive]="true"
                    [rows]="10"
                    dataKey="vin"
                    selectionMode="single"
                    [(selection)]="selectedUser"
                >
                    <ng-template pTemplate="header" let-columns>
                        <tr>
                            <th
                                *ngFor="let col of columns"
                                [pSortableColumn]="col.field"
                                [ngSwitch]="col.field"
                                [ngStyle]="{ width: col.width }"
                            >
                                {{ col.header }}
                                <p-sortIcon [field]="col.field"></p-sortIcon>
                            </th>
                            <th style="width: 8em; text-align: center;">
                                <button
                                    pButton
                                    type="button"
                                    icon="pi pi-cog"
                                ></button>
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template
                        pTemplate="body"
                        let-rowData
                        let-columns="columns"
                    >
                        <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                            <td class="ui-resizable-column">
                                <span class="ui-column-title">Username </span>
                                {{ rowData.username }}
                            </td>
                            <td class="ui-resizable-column">
                                <span class="ui-column-title">Email </span>
                                {{ rowData.email }}
                            </td>
                            <td>
                                <button
                                    pButton
                                    type="button"
                                    class="ui-button-info"
                                    style="margin: 5px;"
                                    label="Show"
                                    icon="fa fa-user"
                                    (click)="editMember(rowData)"
                                ></button>
                                <button
                                    pButton
                                    type="button"
                                    style="margin: 5px;"
                                    class="ui-button-danger"
                                    icon="pi pi-times"
                                    label="Delete"
                                    (click)="deleteMember(rowData)"
                                ></button>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</div>
<p-dialog
    header="User"
    [(visible)]="displayBasic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
>
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    placeholder="Username"
                    [(ngModel)]="member.username"
                    [readonly]="readonly"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    placeholder="Email"
                    [(ngModel)]="member.email"
                    [readonly]="readonly"
                />
            </div>
        </div>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancel()"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            *ngIf="displaySave"
            type="button"
            pButton
            icon="pi pi-check"
            (click)="save()"
            label="Save"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner></ngx-spinner>
