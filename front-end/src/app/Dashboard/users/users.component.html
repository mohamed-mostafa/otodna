<p-toast></p-toast>
<p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-3">
        <button
            #btn
            type="button"
            pButton
            icon="fa fa-user-plus"
            label="Invite User"
            (click)="showInviteUserDialog()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-9"></div>
</div>
<p-dialog
    header="Invite User"
    [(visible)]="displayInviteUserDialog"
    [style]="{ width: '55vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
>
    <p-card [style]="{ height: '200px' }">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-12">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Full Name"
                        [(ngModel)]="inviteUser.fullName"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-8">
                <div class="ui-inputgroup">
                    <input
                        type="text"
                        pInputText
                        placeholder="Email"
                        [(ngModel)]="inviteUser.email"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-4">
                <p-dropdown
                    [options]="roles"
                    [(ngModel)]="inviteUser.role"
                    placeholder="Select A Role"
                    optionLabel="name"
                    [showClear]="true"
                ></p-dropdown>
            </div>
        </div>
    </p-card>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="displayInviteUserDialog = false"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="saveInviteUserDialog()"
            label="Ok"
        ></button>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12">
        <div class="card card-w-title">
            <p-table
                #dt
                [columns]="cols"
                styleClass="ui-table-cars"
                [value]="users"
                [paginator]="true"
                [resizableColumns]="true"
                [responsive]="true"
                [rows]="10"
                dataKey="vin"
                selectionMode="single"
                [(selection)]="selectedUser"
            >
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            [pSortableColumn]="col.field"
                            [ngSwitch]="col.field"
                            [ngStyle]="{ width: col.width }"
                        >
                            {{ col.header }}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                        <th style="width: 10em; text-align: center">
                            <button
                                pButton
                                type="button"
                                icon="pi pi-cog"
                            ></button>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                        <td class="ui-resizable-column center">
                            <span class="ui-column-title">Username </span>
                            <a
                                href="javascript:void(0)"
                                (click)="editUser(rowData)"
                                >{{ rowData.username }}</a
                            >
                        </td>
                        <td class="ui-resizable-column center">
                            <span class="ui-column-title">Full Name </span>
                            {{ rowData.fullName }}
                        </td>
                        <td class="ui-resizable-column center">
                            <span class="ui-column-title">Email </span>
                            {{ rowData.emailAddress }}
                        </td>
                        <td class="ui-resizable-column center">
                            <span class="ui-column-title">Status </span>
                            <p>{{ checkStatus(rowData) }}</p>
                        </td>
                        <td class="center">
                            <a
                                *ngIf="rowData.approved === false"
                                href="javascript:void(0)"
                                class="btnStyle"
                                (click)="approveUser(rowData)"
                            >
                                Approve</a
                            >
                            <a
                                *ngIf="rowData.approved === false"
                                href="javascript:void(0)"
                                class="btnStyle rejectBtn"
                                (click)="rejectUser(rowData)"
                            >
                                Reject</a
                            >
                            <a
                                *ngIf="
                                    rowData.approved === true &&
                                    rowData.active === true
                                "
                                href="javascript:void(0)"
                                class="btnStyle deActivateBtn"
                                (click)="deActivateUser(rowData)"
                            >
                                Deactivate</a
                            >
                            <a
                                *ngIf="
                                    rowData.approved === true &&
                                    rowData.active === false
                                "
                                href="javascript:void(0)"
                                class="btnStyle activateColor"
                                (click)="activateUser(rowData)"
                            >
                                Activate</a
                            >
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<p-dialog
    header="Edit User"
    [(visible)]="displayBasic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
    [maximizable]="true"
>
    <div style="height: 250px">
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-6">
                <label for="username">Username</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        pInputText
                        id="username"
                        placeholder="Username"
                        readonly="true"
                        [(ngModel)]="user.username"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="fullName">FullName</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        pInputText
                        placeholder="FullName"
                        readonly="true"
                        id="fullName"
                        [(ngModel)]="user.fullName"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="email">Email</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        pInputText
                        placeholder="Email"
                        readonly="true"
                        id="email"
                        [(ngModel)]="user.emailAddress"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="status">Status</label>
                <div class="ui-inputgroup labelMarginTop">
                    <input
                        type="text"
                        pInputText
                        placeholder="Status"
                        readonly="true"
                        id="status"
                        [(ngModel)]="user.status"
                    />
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="role">Role</label>
                <div class="labelMarginTop">
                    <p-dropdown
                        [options]="roles"
                        [(ngModel)]="role"
                        placeholder="Select A Role"
                        optionLabel="name"
                        id="role"
                        [showClear]="true"
                    ></p-dropdown>
                </div>
            </div>
            <div class="ui-g-12 ui-md-6">
                <label for="userType">User Type</label>
                <div class="labelMarginTop">
                    <p-dropdown
                        [options]="userTypes"
                        [(ngModel)]="userType"
                        placeholder="Select A user Type"
                        optionLabel="name"
                        id="userType"
                        [showClear]="true"
                    ></p-dropdown>
                </div>
            </div>
        </div>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancel()"
            label="Cancel"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="saveEditUser()"
            label="Save"
            class="ui-button-icon-primary"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner type="ball-fussion" color="#61b5a1"></ngx-spinner>
