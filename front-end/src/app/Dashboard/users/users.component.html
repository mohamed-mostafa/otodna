<p-toast></p-toast>
<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12 ui-md-3">
        <button
            #btn
            type="button"
            pButton
            icon="fa fa-user-plus"
            label="Invite User"
            (click)="showInviteUserDialog()"
        ></button>
    </div>
    <div class="ui-g-12 ui-md-9"></div>
</div>
<p-dialog
    header="Invite User"
    [(visible)]="displayInviteUserDialog"
    [style]="{ width: '35vw' }"
    [baseZIndex]="10000"
>
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-12">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    placeholder="Full Name"
                    [(ngModel)]="inviteUser.fullName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-12">
            <div class="ui-inputgroup">
                <input
                    type="text"
                    pInputText
                    placeholder="Email"
                    [(ngModel)]="inviteUser.email"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-12">
            <p-dropdown
                [options]="roles"
                [(ngModel)]="inviteUser.role"
                placeholder="Select A Role"
                optionLabel="name"
                [showClear]="true"
            ></p-dropdown>
        </div>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="displayInviteUserDialog = false"
            label="No"
            class="ui-button-secondary"
        ></button>
        <button
            type="button"
            pButton
            icon="pi pi-check"
            (click)="saveInviteUserDialog()"
            label="Ok"
        ></button>
    </p-footer>
</p-dialog>
<div class="ui-g ui-fluid">
    <div class="ui-g-12">
        <div class="card card-w-title">
            <p-table
                #dt
                [columns]="cols"
                styleClass="ui-table-cars"
                [value]="users"
                [paginator]="true"
                [resizableColumns]="true"
                [responsive]="true"
                [rows]="10"
                dataKey="vin"
                selectionMode="single"
                [(selection)]="selectedUser"
            >
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th
                            *ngFor="let col of columns"
                            [pSortableColumn]="col.field"
                            [ngSwitch]="col.field"
                            [ngStyle]="{ width: col.width }"
                        >
                            {{ col.header }}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                        <th style="width: 10em; text-align: center;">
                            <button
                                pButton
                                type="button"
                                icon="pi pi-cog"
                            ></button>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns">
                    <tr [pSelectableRow]="rowData" [pEditableRow]="rowData">
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Username </span>
                            <a
                                href="javascript:void(0)"
                                (click)="editUser(rowData)"
                                >{{ rowData.username }}</a
                            >
                        </td>
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Full Name </span>
                            {{ rowData.fullName }}
                        </td>
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Email </span>
                            {{ rowData.email }}
                        </td>
                        <td class="ui-resizable-column">
                            <span class="ui-column-title">Status </span>
                            {{ rowData.status }}
                        </td>
                        <td>
                            <button
                                *ngIf="rowData.status === 'Pending'"
                                pButton
                                type="button"
                                style="margin: 5px;"
                                class="ui-button-success"
                                label="Approve"
                                (click)="approveUser(rowData)"
                            ></button>
                            <button
                                *ngIf="rowData.status === 'Pending'"
                                pButton
                                type="button"
                                style="margin: 5px;"
                                class="ui-button-danger"
                                label="Reject"
                                (click)="rejectUser(rowData)"
                            ></button>
                            <button
                                *ngIf="rowData.status === 'Active'"
                                pButton
                                type="button"
                                style="margin: 5px;"
                                class="ui-button-warning"
                                label="De Activate"
                                (click)="deActivateUser(rowData)"
                            ></button>
                            <button
                                *ngIf="rowData.status === 'InActive'"
                                pButton
                                type="button"
                                style="margin: 5px;"
                                class="ui-button-info"
                                label="Activate"
                                (click)="activateUser(rowData)"
                            ></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<p-dialog
    header="Edit User"
    [(visible)]="displayBasic"
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
>
    <div class="ui-g ui-fluid">
        <div class="ui-g-12 ui-md-6">
            <label for="username">Username</label>
            <div class="ui-inputgroup labelMarginTop">
                <input
                    type="text"
                    pInputText
                    id="username"
                    placeholder="Username"
                    readonly="true"
                    [(ngModel)]="user.username"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <label for="fullName">FullName</label>
            <div class="ui-inputgroup labelMarginTop">
                <input
                    type="text"
                    pInputText
                    placeholder="FullName"
                    readonly="true"
                    id="fullName"
                    [(ngModel)]="user.fullName"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <label for="email">Email</label>
            <div class="ui-inputgroup labelMarginTop">
                <input
                    type="text"
                    pInputText
                    placeholder="Email"
                    readonly="true"
                    id="email"
                    [(ngModel)]="user.email"
                />
            </div>
        </div>
        <div class="ui-g-12 ui-md-6">
            <label for="status">Status</label>
            <div class="ui-inputgroup labelMarginTop">
                <input
                    type="text"
                    pInputText
                    placeholder="Status"
                    readonly="true"
                    id="status"
                    [(ngModel)]="user.status"
                />
            </div>
        </div>
    </div>
    <p-footer>
        <button
            type="button"
            pButton
            icon="pi pi-times"
            (click)="cancel()"
            label="Ok"
            class="ui-button-icon-primary"
        ></button>
    </p-footer>
</p-dialog>
<ngx-spinner></ngx-spinner>
