<div class="layout-topbar">
    <a href="/dashboard" class="layout-topbar-logo otoStyle">
        <img id="Otodna-logo" src="assets/layout/images/logo.png" />
    </a>

    <a
        href="#"
        class="layout-menu-button show"
        (click)="app.onMenuButtonClick($event)"
    >
        <i class="fa fa-bars"></i>
    </a>
    <!-- <a href="/dashboard" class="logoStyle">
        <img
            id="Otodna-logo"
            class="imgStyle"
            src="assets/layout/images/logo.png"
        />
    </a> -->

    <div class="welcomeStyle">
        <div>
            {{ welcomeTime }} {{ fullName }}
            <span class="intro-box-detail">({{ job }})</span>
        </div>
    </div>
    <a
        href="#"
        class="layout-topbar-user"
        (click)="app.onTopbarMenuButtonClick($event)"
    >
        <img
            src="assets/layout/images/avatar.png"
            style="margin-top: 10px"
            alt="olympia-layout"
        />
    </a>

    <ul
        class="layout-topbar-usermenu"
        [ngClass]="{
            'layout-topbar-usermenu-active fadeInDown': app.topbarMenuActive
        }"
    >
        <li class="layout-topbar-usermenu-header">
            <img src="assets/layout/images/avatar2.png" alt="olympia-layout" />
            <div class="layout-topbar-usermenu-info">
                <div class="layout-topbar-usermenu-name">
                    Welcome<br />
                    {{ fullName }}
                </div>
                <div class="layout-topbar-usermenu-role">{{ job }}</div>
            </div>
        </li>
        <li>
            <a href="#" (click)="app.onTopbarSubItemClick($event)">
                <i class="fa fa-fw fa-user"></i>
                <span class="topbar-item-name">Profile</span>
            </a>
        </li>

        <li>
            <a href="javascript:void(0)" (click)="logout()">
                <i class="fa fa-fw fa-sign-out"></i>
                <span class="topbar-item-name">Logout</span>
            </a>
        </li>
    </ul>
    <a
        href="javascript:void(0)"
        (click)="menu.toggle($event); loadNotifications()"
        class="notification layout-topbar-user"
    >
        <i class="fa fa-2x fa-fw fa-bell-o"></i>
        <span class="topbar-item-name"></span>
    </a>
    <p-menu #menu [popup]="true" [model]="notifications"></p-menu>
</div>
