<div class="body"></div>
<div class="login-body">
    <div class="login-topbar">
        <img src="assets/layout/images/image.png" alt="olympia-layout" />
    </div>
    <div class="login-panel">
        <h1>SIGN IN TO OTODNA</h1>
        <p>Welcome, please use the form to sign-in.</p>
        <div class="input-wrapper">
            <label for="username">Username</label>
            <input
                type="text"
                autocomplete="off"
                [(ngModel)]="username"
                id="username"
                class="ui-inputtext ui-widget"
            />
        </div>
        <div class="input-wrapper">
            <label for="password">Password</label>
            <input
                type="password"
                autocomplete="off"
                [(ngModel)]="password"
                id="password"
                class="ui-inputtext ui-widget"
            />
        </div>
        <button
            type="button"
            class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only color"
        >
            <i class="fa fa-fw fa-sign-in"></i>
            <span class="ui-button-text ui-c" (click)="login()">Login</span>
        </button>

        <div class="separator"></div>
        <a href="javascript:void(0)" class="registerStyle" (click)="register()">
            Register</a
        >
    </div>
</div>
<ngx-spinner></ngx-spinner>
