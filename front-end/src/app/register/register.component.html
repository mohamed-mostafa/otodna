<p-toast></p-toast>
<div class="body"></div>
<div class="login-body">
    <div class="login-topbar">
        <img src="assets/layout/images/image.png" alt="Otodna-layout" />
        <img
            src="assets/layout/images/logo.png"
            class="logoStyle"
            alt="olympia-layout"
        />
    </div>
    <div class="login-panel">
        <h1>Create An Account</h1>
        <p>Welcome, please use the form to sign-up.</p>
        <div class="ui-inputgroup inputMargin">
            <span class="ui-inputgroup-addon"><i class="pi pi-user"></i></span>
            <input
                type="text"
                pInputText
                placeholder="FullName"
                class="inputFullWidth"
                [(ngModel)]="user.fullName"
            />
        </div>
        <div class="ui-inputgroup inputMargin">
            <span class="ui-inputgroup-addon"><i class="pi pi-user"></i></span>
            <input
                type="text"
                pInputText
                placeholder="Username"
                class="inputFullWidth"
                [(ngModel)]="user.username"
            />
        </div>
        <div class="ui-inputgroup inputMargin">
            <span class="ui-inputgroup-addon"
                ><i class="fa fa-envelope"></i
            ></span>
            <input
                type="text"
                pInputText
                placeholder="Email"
                class="inputFullWidth"
                [(ngModel)]="user.emailAddress"
            />
        </div>

        <div class="ui-inputgroup inputMargin">
            <span class="ui-inputgroup-addon"><i class="pi pi-lock"></i></span>
            <input
                type="password"
                pInputText
                placeholder="password"
                class="inputFullWidth"
                [(ngModel)]="user.password"
            />
        </div>
        <div class="ui-inputgroup inputMargin">
            <span class="ui-inputgroup-addon"><i class="pi pi-lock"></i></span>
            <input
                type="password"
                pInputText
                placeholder="Confirm Password"
                class="inputFullWidth"
                [(ngModel)]="confirmPassword"
            />
        </div>
        <div class="inputMargin">
            <select name="roles" id="role" [(ngModel)]="user.role_id">
                <option [ngValue]="" selected>Select Role</option>
                <option *ngFor="let r of roles" [ngValue]="r.id">{{
                    r.name
                }}</option>
            </select>
        </div>

        <button
            type="button"
            class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only color"
            style="display: inline;"
        >
            <i class="fa fa-fw fa-user-plus"></i>
            <span class="ui-button-text ui-c" (click)="register()"
                >Register</span
            >
        </button>
        <a href="javascript:void(0)" class="loginStyle" (click)="goToLogin()">
            Already Have An Account</a
        >
        <div class="separator"></div>
    </div>
</div>
<ngx-spinner></ngx-spinner>
